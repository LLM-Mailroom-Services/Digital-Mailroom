<text x="600" y="44" font-size="13" fill="#8b9bb4" font-weight="700" text-anchor="middle" letter-spacing="3">THE MAILROOM CONSTELLATION · THE VISUALIZER</text><ellipse cx="600" cy="116" rx="420" ry="70" fill="url(#glow)" opacity=".18"/><text x="600" y="126" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#ttl)">The-Mailroom</text><text x="600" y="170" font-size="20" fill="#cbd5e1" text-anchor="middle">Every pipeline run as an animated conveyor of envelopes — driven by real traces.</text><text x="600" y="202" font-size="13" fill="#8b9bb4" font-weight="600" text-anchor="middle" letter-spacing="3">PIXEL CONSOLE · OBSERVATORY · TERMINAL UI · LANGFUSE-ONLY · REPLAY</text><defs><g id="penv"><rect width="22" height="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><rect x="3" y="3" width="6" height="4" fill="#6366f1"/><rect x="3" y="10" width="14" height="1.6" fill="#94a3b8"/></g><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".05"/></pattern></defs>
