# SAND-042 RCA re-check — insurance-claims · n=50 · 1×L4 · client concurrency 8.
# IDENTICAL to sand42-50-insurance-claims-specialist-awq-1l4-c8 (same 50-doc draw, engine,
# decode) except: prompt insurance_claims_specialist_simplified_v2 (per-source layout cues,
# no phantom sorter handoff, bare-number amounts) and the fixed vendored schema
# (contract-nullable scalars, currency-tolerant claimed_amount).
# Expect: schema_valid_rate ≈ 0.95-1.00 (was 0.26-0.34). n=50 runs ~2.5 min on 1×L4.
# Not a benchmark cell.
schema: sandbox.run/v1
run_id: rca-50-insurance-v2-awq-1l4-c8
task: insurance_claims_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    insurance_claims_specialist:
      source: local
      file: insurance_claims_specialist_simplified_v2

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - doc_class: insurance_claim
        count: 50
        sub_buckets:
          - {subclass: "auto", count: 13}
          - {subclass: "property", count: 9}
          - {subclass: "carrier", count: 7}
          - {subclass: "inpatient", count: 7}
          - {subclass: "outpatient", count: 7}
          - {subclass: "pde", count: 7}
  limit: 50
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: "awq_marlin"
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 32
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 1
    min_containers: 1
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.55
  max_wall_seconds: 2400

trace:
  sink: none
  otlp: false
  environment: sand42
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, rca, insurance-v2, 1l4-c8]
