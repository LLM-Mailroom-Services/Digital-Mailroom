<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" role="img" aria-labelledby="t d"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
  <title id="t">Quickstart terminal</title>
  <desc id="d">Animated terminal typing the Digital Mailroom quickstart: clone, uv sync, run a package suite, check package sync status and the board status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient>
  </defs>
  <rect id="cyc" width="1" height="1" fill="none"><animate id="loop" attributeName="x" from="0" to="0" dur="22s" begin="0s;loop.end"/></rect>
  <rect x="1" y="1" width="898" height="390" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="44" rx="16" fill="#1c2230"/>
  <rect x="1" y="30" width="898" height="15" fill="#1c2230"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text x="450" y="28" text-anchor="middle" font-size="13" fill="#8b949e">~/Digital-Mailroom — zsh</text>
  <clipPath id="c0"><rect x="30" y="72" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="696" dur="2.92s" begin="loop.begin+0.60s" fill="freeze"/></rect></clipPath>
  <text x="32" y="92" font-size="15" clip-path="url(#c0)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">git clone https://github.com/LLM-Mailroom-Services/Digital-Mailroom.git</tspan></text>
  <clipPath id="c1"><rect x="30" y="102" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="318" dur="1.28s" begin="loop.begin+4.42s" fill="freeze"/></rect></clipPath>
  <text x="32" y="122" font-size="15" clip-path="url(#c1)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">cd Digital-Mailroom &amp;&amp; uv sync</tspan></text>
  <clipPath id="c2"><rect x="30" y="132" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="429" dur="0.35s" begin="loop.begin+6.60s" fill="freeze"/></rect></clipPath>
  <text x="32" y="152" font-size="15" clip-path="url(#c2)" fill="#8b949e" font-style="italic">  # one workspace · one lockfile · one .venv</text>
  <clipPath id="c3"><rect x="30" y="162" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="484" dur="2.0s" begin="loop.begin+7.45s" fill="freeze"/></rect></clipPath>
  <text x="32" y="182" font-size="15" clip-path="url(#c3)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">uv run pytest packages/llm-dojo-scoring/tests -q</tspan></text>
  <clipPath id="c4"><rect x="30" y="192" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="567" dur="0.35s" begin="loop.begin+10.35s" fill="freeze"/></rect></clipPath>
  <text x="32" y="212" font-size="15" clip-path="url(#c4)" fill="#8b949e" font-style="italic">  # one package per pytest run — your local run is the gate</text>
  <clipPath id="c5"><rect x="30" y="222" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="392" dur="1.6s" begin="loop.begin+11.20s" fill="freeze"/></rect></clipPath>
  <text x="32" y="242" font-size="15" clip-path="url(#c5)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">python scripts/sync_packages.py status</tspan></text>
  <clipPath id="c6"><rect x="30" y="252" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="548" dur="0.35s" begin="loop.begin+13.70s" fill="freeze"/></rect></clipPath>
  <text x="32" y="272" font-size="15" clip-path="url(#c6)" fill="#8b949e" font-style="italic">  # drift report: hub copies vs. their standalone sources</text>
  <clipPath id="c7"><rect x="30" y="282" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="374" dur="1.52s" begin="loop.begin+14.55s" fill="freeze"/></rect></clipPath>
  <text x="32" y="302" font-size="15" clip-path="url(#c7)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">python scripts/board_state.py status</tspan></text>
  <clipPath id="c8"><rect x="30" y="312" height="28" width="0">
    <set attributeName="width" to="0" begin="loop.begin"/>
    <animate attributeName="width" from="0" to="585" dur="0.35s" begin="loop.begin+16.97s" fill="freeze"/></rect></clipPath>
  <text x="32" y="332" font-size="15" clip-path="url(#c8)" fill="#8b949e" font-style="italic">  # who is working on what, straight from governance/TASKS.md</text>
  <rect x="32" y="346" width="9" height="19" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
