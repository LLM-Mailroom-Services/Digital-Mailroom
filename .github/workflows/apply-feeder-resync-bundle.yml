# Fast-forwards main to feeder sync commit dc5eeb1d via git bundle.
name: Apply feeder resync bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-feeder-resync-bundle.yml"
      - "tools/feeder-resync/BUNDLE_SOURCE"

permissions:
  contents: write

env:
  BUNDLE_BASE: https://raw.githubusercontent.com/Exios66/llm-dojo-scoring/cursor/feeder-bundle-host-d595/tools/digital-mailroom-feeder-resync
  TARGET_SHA: dc5eeb1d8b83a05b1463a5e8c78c521c362bac42

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if already applied
        id: skip
        run: |
          if git rev-parse HEAD^{commit} | grep -qi "^${TARGET_SHA:0:7}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and decode bundle
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for part in aa ab ac ad ae af ag ah ai; do
            curl -fsSL "${BUNDLE_BASE}/bundle.b64.${part}" >> /tmp/feeder-resync.bundle.b64
          done
          base64 -d /tmp/feeder-resync.bundle.b64 > /tmp/feeder-resync.bundle
          git bundle verify /tmp/feeder-resync.bundle

      - name: Force-update main to bundle HEAD
        if: steps.skip.outputs.skip != 'true'
        run: |
          git fetch /tmp/feeder-resync.bundle HEAD:refs/heads/feeder-resync
          git push --force-with-lease origin refs/heads/feeder-resync:main
