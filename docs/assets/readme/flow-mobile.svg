<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1110" width="640" height="1110" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">From a trace to a screen</title>
  <desc id="d">Traces from Langfuse (or Phoenix) are interpreted into stations, served over one display API and rendered by four surfaces; review decisions go back to the producer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
  <rect width="640" height="1110" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="639" height="1109" rx="24" fill="none" stroke="#1f2a44"/>

<text x="24" y="40" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="2">FROM A TRACE TO A SCREEN</text>
<path id="chain" d="M320 111.0 V543.0" fill="none"/>
<rect x="24" y="70" width="592" height="82" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="86" width="5" height="50" rx="2" fill="#38bdf8"/><text x="54" y="104" font-size="18" fill="#e2e8f0" font-weight="700">Trace</text><text x="54" y="126" font-size="14" fill="#94a3b8">Langfuse or Phoenix</text><text x="54" y="144" font-size="12" fill="#64748b">the sole display source</text>
<path d="M320 155 L320 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="178" width="592" height="82" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="194" width="5" height="50" rx="2" fill="#22c55e"/><text x="54" y="212" font-size="18" fill="#e2e8f0" font-weight="700">Interpret</text><text x="54" y="234" font-size="14" fill="#94a3b8">interpret_trace</text><text x="54" y="252" font-size="12" fill="#64748b">spans → stations</text>
<path d="M320 263 L320 283" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="286" width="592" height="82" rx="14" fill="#0f172a" stroke="#a3e635" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="302" width="5" height="50" rx="2" fill="#a3e635"/><text x="54" y="320" font-size="18" fill="#e2e8f0" font-weight="700">Serve</text><text x="54" y="342" font-size="14" fill="#94a3b8">/api/* + /ws</text><text x="54" y="360" font-size="12" fill="#64748b">one display API</text>
<path d="M320 371 L320 391" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="394" width="592" height="82" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="410" width="5" height="50" rx="2" fill="#a78bfa"/><text x="54" y="428" font-size="18" fill="#e2e8f0" font-weight="700">Render</text><text x="54" y="450" font-size="14" fill="#94a3b8">four surfaces</text><text x="54" y="468" font-size="12" fill="#64748b">console · Observatory · TUI</text>
<path d="M320 479 L320 499" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="24" y="502" width="592" height="82" rx="14" fill="#0f172a" stroke="#fb923c" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="518" width="5" height="50" rx="2" fill="#fb923c"/><text x="54" y="536" font-size="18" fill="#e2e8f0" font-weight="700">Act</text><text x="54" y="558" font-size="14" fill="#94a3b8">review resolve</text><text x="54" y="576" font-size="12" fill="#64748b">to the producer API</text>
<circle class="motion" r="5" fill="#7dd3fc" filter="url(#soft)"><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite"><mpath href="#chain"/></animateMotion></circle>
<text x="24" y="624" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="2">WHAT IT READS AND WHERE IT RUNS</text>
<g opacity=".92"><rect x="24" y="640" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="656" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="674" font-size="17" fill="#e2e8f0" font-weight="700">llm-mailroom</text><text x="54" y="696" font-size="14" fill="#94a3b8">Langfuse traces</text><text x="54" y="714" font-size="12" fill="#64748b">the default producer</text></g>
<g opacity=".92"><rect x="24" y="730" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="746" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="764" font-size="17" fill="#e2e8f0" font-weight="700">mailroom-reloaded</text><text x="54" y="786" font-size="14" fill="#94a3b8">Phoenix spans</text><text x="54" y="804" font-size="12" fill="#64748b">mailroom.node.*</text></g>
<g opacity=".92"><rect x="24" y="820" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="836" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="854" font-size="17" fill="#e2e8f0" font-weight="700">Dojo</text><text x="54" y="876" font-size="14" fill="#94a3b8">optional [eval]</text><text x="54" y="894" font-size="12" fill="#64748b">offline evaluation</text></g>
<g opacity=".92"><rect x="24" y="910" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="926" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="944" font-size="17" fill="#e2e8f0" font-weight="700">HF Space</text><text x="54" y="966" font-size="14" fill="#94a3b8">live Observatory</text><text x="54" y="984" font-size="12" fill="#64748b">public Docker Space</text></g>
<g opacity=".92"><rect x="24" y="1000" width="592" height="82" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="38" y="1016" width="5" height="50" rx="2" fill="#f472b6"/><text x="54" y="1034" font-size="17" fill="#e2e8f0" font-weight="700">GH Pages</text><text x="54" y="1056" font-size="14" fill="#94a3b8">terminal site</text><text x="54" y="1074" font-size="12" fill="#64748b">static snapshot</text></g>
</svg>
