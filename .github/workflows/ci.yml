name: ci

# Hub mailroom-issues#176: run the per-package pytest suites (one package per
# job — see AGENTS.md collision rule) plus board-site API tests and the
# hermetic scripts/tests unittest suite. Governance gates stay in
# board-governance.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-tests:
    name: pytest — ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: llm-dojo-scoring
            pytest_path: packages/llm-dojo-scoring/tests
            timeout_minutes: 15
          - package: llm-entity-extraction
            pytest_path: packages/llm-entity-extraction/tests
            timeout_minutes: 15
          - package: llm-mailroom
            pytest_path: packages/llm-mailroom/src/tests
            timeout_minutes: 25
          - package: agent-mailroom
            pytest_path: packages/agent-mailroom/tests
            timeout_minutes: 15
          - package: local-mailroom-sandbox
            pytest_path: packages/local-mailroom-sandbox/tests
            timeout_minutes: 15
          - package: The-Mailroom
            pytest_path: packages/The-Mailroom/tests
            timeout_minutes: 15
          - package: claims-data-eda
            pytest_path: packages/claims-data-eda/tests
            timeout_minutes: 10
          - package: Enron-Evaluation-Environment
            pytest_path: packages/Enron-Evaluation-Environment/tests
            timeout_minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync workspace
        run: uv sync
      - name: Run package suite
        run: uv run pytest ${{ matrix.pytest_path }} -q --tb=line

  scripts-tests:
    name: unittest — scripts/tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hermetic sync/release/board script tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

  board-site-api:
    name: node — board-site/tests/api.test.js
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Board API regression (stubbed fetch)
        working-directory: board-site
        run: node tests/api.test.js
