<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
  <title id="t">~/local-mailroom-sandbox — zsh</title>
  <desc id="d">Animated terminal: install, copy the env file, bring up Langfuse and Ollama, pull the model, check health, then run the pilot with the mock and with a local model.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient></defs>
  <rect id="cyc" width="1" height="1" fill="none"><animate id="loop" attributeName="x" from="0" to="0" dur="19.2s" begin="0s;loop.end"/></rect>
  <rect x="1" y="1" width="898" height="450" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="44" rx="16" fill="#1c2230"/>
  <rect x="1" y="30" width="898" height="15" fill="#1c2230"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text x="450" y="28" text-anchor="middle" font-size="13" fill="#8b949e">~/local-mailroom-sandbox — zsh</text>
  <clipPath id="c0"><rect x="30" y="72" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="254" dur="1.0s" begin="loop.begin+0.6s" fill="freeze"/></rect></clipPath>
  <text x="32" y="92" font-size="15" clip-path="url(#c0)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">pip install -e &quot;.[dev]&quot;</tspan></text>
  <clipPath id="c1"><rect x="30" y="102" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="290.8" dur="1.16s" begin="loop.begin+2.5s" fill="freeze"/></rect></clipPath>
  <text x="32" y="122" font-size="15" clip-path="url(#c1)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">cp config/.env.example .env</tspan></text>
  <clipPath id="c2"><rect x="30" y="132" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="134.4" dur="0.48s" begin="loop.begin+4.6s" fill="freeze"/></rect></clipPath>
  <text x="32" y="152" font-size="15" clip-path="url(#c2)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox up</tspan></text>
  <clipPath id="c3"><rect x="30" y="162" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="382.8" dur="0.35s" begin="loop.begin+5.9s" fill="freeze"/></rect></clipPath>
  <text x="32" y="182" font-size="15" clip-path="url(#c3)" fill="#8b949e" font-style="italic">  # compose profiles: langfuse + ollama</text>
  <clipPath id="c4"><rect x="30" y="192" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="217.2" dur="0.84s" begin="loop.begin+6.8s" fill="freeze"/></rect></clipPath>
  <text x="32" y="212" font-size="15" clip-path="url(#c4)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox pull-models</tspan></text>
  <clipPath id="c5"><rect x="30" y="222" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="244.8" dur="0.35s" begin="loop.begin+8.5s" fill="freeze"/></rect></clipPath>
  <text x="32" y="242" font-size="15" clip-path="url(#c5)" fill="#8b949e" font-style="italic">  # ollama pull qwen3:8b</text>
  <clipPath id="c6"><rect x="30" y="252" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="171.2" dur="0.64s" begin="loop.begin+9.4s" fill="freeze"/></rect></clipPath>
  <text x="32" y="272" font-size="15" clip-path="url(#c6)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox health</tspan></text>
  <clipPath id="c7"><rect x="30" y="282" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="226.4" dur="0.88s" begin="loop.begin+10.9s" fill="freeze"/></rect></clipPath>
  <text x="32" y="302" font-size="15" clip-path="url(#c7)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox pilot --mock</tspan></text>
  <clipPath id="c8"><rect x="30" y="312" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="263.2" dur="0.35s" begin="loop.begin+12.7s" fill="freeze"/></rect></clipPath>
  <text x="32" y="332" font-size="15" clip-path="url(#c8)" fill="#8b949e" font-style="italic">  # machinery only, no LLM</text>
  <clipPath id="c9"><rect x="30" y="342" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="235.6" dur="0.92s" begin="loop.begin+13.5s" fill="freeze"/></rect></clipPath>
  <text x="32" y="362" font-size="15" clip-path="url(#c9)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox pilot --local</tspan></text>
  <clipPath id="c10"><rect x="30" y="372" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="401.2" dur="0.35s" begin="loop.begin+15.4s" fill="freeze"/></rect></clipPath>
  <text x="32" y="392" font-size="15" clip-path="url(#c10)" fill="#8b949e" font-style="italic">  # the same pipeline on your local model</text>
  <rect class="motion" x="32" y="406" width="9" height="19" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
