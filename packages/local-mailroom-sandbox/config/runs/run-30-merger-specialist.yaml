# Specialist extract: merger_agreement_specialist on 30 MERGER_AGREEMENT docs.
# Dedicated MAUD specialist (issue #9 / DMR-078) — not contracts_specialist.
# Test split has only ~17 mergers — MUST use train (135 merger rows at pin).
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ CUT SPEND (DMR-076/077/078) — MANDATORY operator posture                 ║
# ║  1. ONE warm sandbox-vllm app through YOUR TRACK (or all five if solo).  ║
# ║  2. Do NOT tear down / redeploy / stop between classes.                  ║
# ║  3. Teardown ONLY after your last: ./deploy/teardown_vllm.sh             ║
# ║  4. scaledown_seconds: 120 (attended). Unattended/overnight → restore 600║
# ║  5. Default model: Qwen/Qwen3-8B bf16. AWQ optional (DMR-068 gate).       ║
# ║  6. Two-operator: sandbox run suite --suite track-a|track-b (DMR-077).   ║
# ║  7. DMR-078: concurrency=3 (longest docs), cost_cap=$1.00, wall=5400s.   ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
#   # Same warm app as contracts — do NOT redeploy before this run.
#   sandbox run preflight --config config/runs/run-30-merger-specialist.yaml --live
#   sandbox run start --config config/runs/run-30-merger-specialist.yaml --job-mode endpoint --watch
schema: sandbox.run/v1
run_id: run-30-merger-specialist
task: merger_agreement_specialist
profile: modal-vllm

prompt:
  # Pinned local production text (config/prompts/merger_agreement_specialist_production.txt)
  # for reproducible Modal L4 Qwen runs — not Langfuse floating production.
  # Synced from vendored llm-mailroom code-default (merger_agreement_specialist). DMR-074/078.
  default: {source: code-default}
  agents:
    merger_agreement_specialist:
      source: local
      file: merger_agreement_specialist_production

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: train — test has only 17 merger_agreement rows; train has 135
  # (all_cash 51, other 49, all_stock 22, mixed_cash_stock 12,
  # mixed_cash_stock_election 1) at revision 46a4d3c2
  split: train
  revision: 46a4d3c240a36671cde0182fff4960f6b8b73aca   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      # merger_agreement: all 5 consideration types, proportional → 30 rows
      - doc_class: merger_agreement
        sub_buckets:
          - {subclass: all_cash, count: 11}                   # avail 51
          - {subclass: other, count: 11}                      # avail 49
          - {subclass: all_stock, count: 5}                   # avail 22
          - {subclass: mixed_cash_stock, count: 2}            # avail 12
          - {subclass: mixed_cash_stock_election, count: 1}   # avail 1
  limit: 30
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B
  vllm:
    max_model_len: 16384      # boot-valid cap for L4-bf16 8B (v0.29.0 raises above)
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    # Attended cost-saver (DMR-076). Unattended/overnight: restore 600 here
    # and export MODAL_VLLM_SCALEDOWN_SECONDS=600 before redeploy.
    scaledown_seconds: 120
    max_containers: 1         # cost guard — do not raise for specialist runs
    min_containers: 0         # scale-to-zero after idle
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 3              # DMR-078 per-doc-type (short↑ / long↓)
  cost_cap_usd: 1.0        # abort if wall×L4 $/hr exceeds
  max_wall_seconds: 5400    # hard wall abort

trace:
  sink: none
  otlp: false
  environment: specialist-30
  tags: [sandbox, job, specialist, merger, merger_agreement_specialist, qwen3-8b, l4, benchmark]
