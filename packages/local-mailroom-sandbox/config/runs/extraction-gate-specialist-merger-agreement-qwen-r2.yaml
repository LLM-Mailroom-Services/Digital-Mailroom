# Extraction gate round 2: NEW merger_agreement documents for the gate's training set. No document (by id or
# folded text) that any finished specialist run already extracted; each subclass drawn from its
# shorter half first. qwen/qwen3.7-flash, one call per document.
#
#   python scripts/extraction_gate.py --split train expand \
#       --dataset-run reviewer-calibration-luna-decisions-v3.1.0-train
#   sandbox run start --config config/runs/extraction-gate-specialist-merger-agreement-qwen-r2.yaml --initials XX
schema: sandbox.run/v1
run_id: extraction-gate-specialist-merger-agreement-qwen-r2
task: merger_agreement_specialist
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: file
  local_path: data/runtime/handoff/gate-train-r2-merger_agreement.jsonl
  config: ground_truth
  split: train

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_knobs:
  merger_agreement_specialist: {max_input_chars: 1000000}   # whole document in one call (longest r2 merger 739,511 chars; Qwen 3.7 Flash: 1M-token context)

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 12
  cost_cap_usd: 1.00
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.15

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, extraction-gate, specialist-handoff, round-2, merger-agreement]
