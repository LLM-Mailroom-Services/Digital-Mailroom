# Specialist-condensed lineage, validation: corporate_records_specialist_condensed_v1 on the SAME corporate_record documents the
# baseline run extraction-gate-specialist-corporate-record-qwen extracted with the frozen prompt, so the two
# are compared document by document (scripts/compare_specialist_prompt.py). VALIDATION ONLY: these
# outputs repeat baseline documents and are never handed to the extraction gate.
#
#   sandbox run start --config config/runs/specialist-condensed-v1-corporate-record-qwen-ab.yaml --initials XX
schema: sandbox.run/v1
run_id: specialist-condensed-v1-corporate-record-qwen-ab
task: corporate_records_specialist
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist: {source: local, file: corporate_records_specialist_condensed_v1}

dataset:
  provider: file
  local_path: data/runtime/handoff/gate-train-corporate_record.jsonl
  config: ground_truth
  split: train

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_knobs:
  corporate_records_specialist: {max_input_chars: 700000}   # whole document in one call (Qwen 3.7 Flash: 1M-token context)

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 12
  cost_cap_usd: 1.00
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.08

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, specialist-condensed-v1, ab-validation, corporate-record]
