# DMR-067 — 5-doc-type × 10 subclass-stratified sorter run on Gemma 4 E4B.
#
# Fixes the DMR-063/DMR-066 stratification gaps: DMR-063's `strata.expected`
# filter was a no-op (expected_doc_class constant `contract` in the joined
# ground_truth config → contract×N); DMR-066 stratified on expected_subclass
# but only drew CONTRACT-family subclasses. This spec uses the `buckets`
# strata form: 10 rows per doc type × 5 doc types (insurance_claim, contract,
# merger_agreement, correspondence, corporate_record), each doc type spread
# across a representative sample of its underlying subclasses (availability
# verified against the pinned test split, 2026-09-17: 323 rows total).
# Zero duplicates by construction (per-subclass sub-seeded draws with
# earlier picks excluded); strata_guard + strata_draw_guard hard-fail on any
# shortfall or dropped stratum.
#
# Model: google/gemma-4-E4B-it (Apache-2.0, ungated) served via a Modal
# managed Endpoint (`modal endpoint create --model google/gemma-4-E4B-it`).
# The engine.modal block below is declarative (preflight cost guards); the
# live endpoint URL/auth come from VLLM_BASE_URL / VLLM_API_KEY.
schema: sandbox.run/v1
run_id: run-50-gemma4-e4b
task: sorter
profile: modal-vllm

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: test
  revision: 46a4d3c240a36671cde0182fff4960f6b8b73aca   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      - doc_class: insurance_claim
        sub_buckets:
          - {subclass: auto, count: 2}
          - {subclass: carrier, count: 2}
          - {subclass: property, count: 2}
          - {subclass: inpatient, count: 2}
          - {subclass: outpatient, count: 1}
          - {subclass: pde, count: 1}
      - doc_class: contract
        sub_buckets:
          - {subclass: Service, count: 2}
          - {subclass: Supply, count: 2}
          - {subclass: Distributor, count: 1}
          - {subclass: Co_Branding, count: 1}
          - {subclass: Development, count: 1}
          - {subclass: IP, count: 1}
          - {subclass: Maintenance, count: 1}
          - {subclass: "Strategic Alliance", count: 1}
      - doc_class: merger_agreement
        sub_buckets:
          - {subclass: all_cash, count: 3}
          - {subclass: other, count: 4}
          - {subclass: all_stock, count: 2}
          - {subclass: mixed_cash_stock, count: 1}
      - doc_class: correspondence
        sub_buckets:
          - {subclass: email, count: 2}
          - {subclass: letter, count: 2}
          - {subclass: notice, count: 2}
          - {subclass: memo, count: 1}
          - {subclass: press_release, count: 1}
          - {subclass: demand, count: 1}
          - {subclass: meeting_request, count: 1}
      - doc_class: corporate_record
        sub_buckets:
          - {subclass: subsidiary_list, count: 2}
          - {subclass: charter_amendment, count: 2}
          - {subclass: officer_certificate, count: 1}
          - {subclass: articles_of_incorporation, count: 1}
          - {subclass: board_resolution, count: 1}
          - {subclass: indenture, count: 1}
          - {subclass: powers_of_attorney, count: 1}
          - {subclass: rights_instrument, count: 1}
  limit: 50
  sample_seed: 42

engine:
  kind: modal-vllm
  model: google/gemma-4-E4B-it
  vllm:
    max_model_len: 16384      # boot-valid cap; KV pool fits comfortably
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0        # parity pin (declarative; managed endpoint provisions its own)
    scaledown_seconds: 300    # tight idle window — no idle burn after the job
    max_containers: 1         # cost guard; raise to 2 only if throughput demands
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 1              # low retry budget — a failed call retries once, then errors loud
  fail_fast: false
  concurrency: 8              # 8 docs in flight → fills vLLM continuous batching on 1 L4

trace:
  sink: none
  otlp: false
  environment: subclass
  tags: [sandbox, job]