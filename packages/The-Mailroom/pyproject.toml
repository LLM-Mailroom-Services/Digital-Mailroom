[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-mailroom"
version = "0.4.0"
description = "Pixel-art visualization console for the llm-mailroom multi-agent pipeline — Langfuse is the sole source of truth."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langfuse>=4.0,<5",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "bcrypt", "PyJWT", "watchdog"]
# Pinned llm-mailroom (PyPI / dist name: mailroom) @ v0.7.1 / 2a212e76
# (package 0.7.1 — corpus re-pin to the GT-closure revision 46a4d3c2). Pulls langgraph,
# Phoenix, and llm-dojo-scoring — the visualizer display path never imports
# those. Contract helpers live in mailroom_ui/producer.py
# (pipeline.review_resolve, schemas.manifest). Install with:
#   pip install -e ".[pipeline]"
pipeline = [
    "mailroom @ git+https://github.com/Exios66/llm-mailroom.git@2a212e76a62b",
    "structlog>=24.0",
    "pyyaml>=6.0",
]
# Operator desk (auth / archive / bin observer). Display path stays Langfuse.
# bcrypt + PyJWT preferred; stdlib pbkdf2/HMAC fallbacks exist without them.
operator = [
    "bcrypt",
    "PyJWT",
    "watchdog",
    "pymupdf",
]
# Optional React operator desk (`ui/`). Marker only — Node 22+ is required
# separately (`cd ui && npm install && npm run build`). Default [dev] never
# installs npm. Built assets mount at /desk when ui/dist exists.
ui = []

[project.scripts]
mailroom-web = "server.main:run"
mailroom-hosted = "server.hosted:run"
mailroom-tui = "tui.mailroom_console:run"
mailroom-observer = "operator_desk.observer:run"

[tool.setuptools.packages.find]
include = ["mailroom_ui*", "server*", "tui*", "operator_desk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Monorepo dev: resolve the pipeline from the workspace instead of the
# release git pin above. Plain `pip install .` keeps using the pin.
[tool.uv.sources]
mailroom = { workspace = true }
