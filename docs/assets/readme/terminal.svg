<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="900" height="422" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
  <title id="t">~/The-Mailroom — zsh</title>
  <desc id="d">Animated terminal: clone, install, add Langfuse keys, start the pixel console, print one terminal frame and seed demo runs.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient></defs>
  <rect id="cyc" width="1" height="1" fill="none"><animate id="loop" attributeName="x" from="0" to="0" dur="20.3s" begin="0s;loop.end"/></rect>
  <rect x="1" y="1" width="898" height="420" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="44" rx="16" fill="#1c2230"/>
  <rect x="1" y="30" width="898" height="15" fill="#1c2230"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text x="450" y="28" text-anchor="middle" font-size="13" fill="#8b949e">~/The-Mailroom — zsh</text>
  <clipPath id="c0"><rect x="30" y="72" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="530" dur="2.2s" begin="loop.begin+0.6s" fill="freeze"/></rect></clipPath>
  <text x="32" y="92" font-size="15" clip-path="url(#c0)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">git clone https://github.com/Exios66/The-Mailroom.git</tspan></text>
  <clipPath id="c1"><rect x="30" y="102" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="428.8" dur="1.76s" begin="loop.begin+3.7s" fill="freeze"/></rect></clipPath>
  <text x="32" y="122" font-size="15" clip-path="url(#c1)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">cd The-Mailroom &amp;&amp; pip install -e &quot;.[dev]&quot;</tspan></text>
  <clipPath id="c2"><rect x="30" y="132" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="226.4" dur="0.88s" begin="loop.begin+6.4s" fill="freeze"/></rect></clipPath>
  <text x="32" y="152" font-size="15" clip-path="url(#c2)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">cp .env.example .env</tspan></text>
  <clipPath id="c3"><rect x="30" y="162" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="474.8" dur="0.35s" begin="loop.begin+8.1s" fill="freeze"/></rect></clipPath>
  <text x="32" y="182" font-size="15" clip-path="url(#c3)" fill="#8b949e" font-style="italic">  # add LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY</text>
  <clipPath id="c4"><rect x="30" y="192" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="152.8" dur="0.56s" begin="loop.begin+9s" fill="freeze"/></rect></clipPath>
  <text x="32" y="212" font-size="15" clip-path="url(#c4)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">mailroom-web</tspan></text>
  <clipPath id="c5"><rect x="30" y="222" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="594.4" dur="0.35s" begin="loop.begin+10.4s" fill="freeze"/></rect></clipPath>
  <text x="32" y="242" font-size="15" clip-path="url(#c5)" fill="#8b949e" font-style="italic">  # → http://127.0.0.1:8001 · the Observatory is also at /live</text>
  <clipPath id="c6"><rect x="30" y="252" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="336.8" dur="1.36s" begin="loop.begin+11.3s" fill="freeze"/></rect></clipPath>
  <text x="32" y="272" font-size="15" clip-path="url(#c6)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">mailroom-tui --once --view floor</tspan></text>
  <clipPath id="c7"><rect x="30" y="282" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="364.4" dur="0.35s" begin="loop.begin+13.6s" fill="freeze"/></rect></clipPath>
  <text x="32" y="302" font-size="15" clip-path="url(#c7)" fill="#8b949e" font-style="italic">  # one terminal frame, for scripting</text>
  <clipPath id="c8"><rect x="30" y="312" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="290.8" dur="1.16s" begin="loop.begin+14.4s" fill="freeze"/></rect></clipPath>
  <text x="32" y="332" font-size="15" clip-path="url(#c8)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">python scripts/seed_demo.py</tspan></text>
  <clipPath id="c9"><rect x="30" y="342" height="28" width="0"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="622" dur="0.35s" begin="loop.begin+16.5s" fill="freeze"/></rect></clipPath>
  <text x="32" y="362" font-size="15" clip-path="url(#c9)" fill="#8b949e" font-style="italic">  # seeds demo runs into Langfuse, so nothing on screen is canned</text>
  <rect class="motion" x="32" y="376" width="9" height="19" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
