name: Task / TODO
description: A small TODO item for the monorepo — the lightweight form; card-worthy or cross-package work should use the Board card template
title: "TODO: "
labels: ["type/task"]
assignees: Exios66
body:
  - type: markdown
    attributes:
      value: |
        ## TODO item

        Use this for **small, single-session, low-risk** items. Work that is
        critical, cross-package, or externally verifiable belongs on
        `governance/TASKS.md` as a card (with a "Board card (DMR-0NN)" issue
        if synced) — not as a loose TODO.
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - hub (monorepo-level / cross-package)
        - governance (board, AGENTS.md, templates)
        - tooling (scripts/, CI workflows)
        - enron-evaluation-environment
        - the-mailroom
        - agent-mailroom
        - claims-data-eda
        - llm-dojo-scoring
        - llm-entity-extraction
        - llm-mailroom
        - llm-mailroom-graph
        - local-mailroom-sandbox
        - mailroom-corpus-eda
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What needs doing
      description: The concrete change — files, commands, expected outcome
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: The verifiable criterion — a command that passes, a doc section that exists, a drift that reads zero
      placeholder: "python scripts/... exits 0 / README section covers X"
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related card / issue
      description: "DMR-0NN or #NNN if this item extends existing work (update, don't duplicate)"
