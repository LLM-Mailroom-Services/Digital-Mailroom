[project]
name = "mailroom-hub"
version = "0.9.0"
description = "Core Digital Mailroom monorepo: pipeline (llm-mailroom), scoring engine (llm-dojo-scoring), local sandbox (local-mailroom-sandbox), corpus EDA (mailroom-corpus-eda), and visualizer (The-Mailroom)"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    # llm-mailroom notebook suite headless re-execution (nbclient kernel).
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    # Interactive JupyterLab over the whole monorepo's notebooks (browse,
    # edit, run). `uv run jupyter lab` from the repo root opens every
    # package's notebooks/; per-section: `uv run jupyter lab <pkg>/notebooks`.
    "jupyterlab>=4.0",
    "ipywidgets>=8.1",
    # mailroom-corpus-eda script deps that no other member pulls in
    # transitively (virtual member is not installable; its EDA/HF scripts
    # need these in the shared venv).
    "plotly>=7.0",
    "seaborn>=0.13",
    "squarify>=0.4",
    "huggingface_hub>=1.29",
    # Workspace members, editable in the shared venv. Virtual members
    # (Enron-Evaluation-Environment, claims-data-eda, mailroom-corpus-eda) are `package = false` and not installable; their
    # script deps (pandas/numpy/matplotlib/...) ride in transitively via the
    # members below.
    "llm-dojo-scoring",
    "mailroom",
    "mailroom-sandbox",
    "the-mailroom",
]

[tool.uv.sources]
llm-dojo-scoring = { workspace = true }
mailroom = { workspace = true }
mailroom-sandbox = { workspace = true }
the-mailroom = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "no_langchain_mock: llm-mailroom provider-seam tests that disable the conftest LangChain mock",
    "artifact: optional contract pins that require gitignored report artifacts or sibling repos",
]
