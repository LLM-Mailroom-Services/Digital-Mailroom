# Standalone desk container (NOT the production path — compose uses the
# operator image's baked ui/dist at /desk). Serves the SPA at / and proxies
# the API/WS surfaces to a `mailroom` upstream, reachable only when this
# container shares a network with the backend, e.g.:
#   docker network create mailroom-net
#   docker run --network mailroom-net --name mailroom <backend image>
#   docker run --network mailroom-net -p 5174:80 mailroom-ui
upstream mailroom {
    server mailroom:8001;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://mailroom;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://mailroom;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://mailroom;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA fallback (built with VITE_BASE=/ — see ui/Dockerfile).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
