<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" width="1200" height="348" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">From a trace to a screen</title>
  <desc id="d">Traces from Langfuse (or Phoenix) are interpreted into stations, served over one display API and rendered by four surfaces; review decisions go back to the producer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
  <rect width="1200" height="348" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="347" rx="24" fill="none" stroke="#1f2a44"/>

<text x="40" y="42" font-size="13" fill="#8b9bb4" font-weight="700" letter-spacing="3">FROM A TRACE TO A SCREEN</text>
<path id="chain" d="M143.2 126 H1056.8" fill="none"/>
<rect x="40" y="74" width="206.4" height="104" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.5"/><rect x="54" y="90" width="5" height="72" rx="2" fill="#38bdf8"/><text x="70" y="108" font-size="16" fill="#e2e8f0" font-weight="700">Trace</text><text x="70" y="130" font-size="13" fill="#94a3b8">Langfuse or Phoenix</text><text x="70" y="148" font-size="10.4" fill="#64748b">the sole display source</text>
<rect class="motion" x="40" y="74" width="206.4" height="104" rx="14" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.18;1" dur="4.5s" begin="0s" repeatCount="indefinite"/></rect>
<path d="M248.4 126 L266.4 126" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="268.4" y="74" width="206.4" height="104" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity=".7" stroke-width="1.5"/><rect x="282.4" y="90" width="5" height="72" rx="2" fill="#22c55e"/><text x="298.4" y="108" font-size="16" fill="#e2e8f0" font-weight="700">Interpret</text><text x="298.4" y="130" font-size="13" fill="#94a3b8">interpret_trace</text><text x="298.4" y="148" font-size="10.4" fill="#64748b">spans → stations</text>
<rect class="motion" x="268.4" y="74" width="206.4" height="104" rx="14" fill="none" stroke="#22c55e" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.18;1" dur="4.5s" begin="0.9s" repeatCount="indefinite"/></rect>
<path d="M476.8 126 L494.8 126" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="496.8" y="74" width="206.4" height="104" rx="14" fill="#0f172a" stroke="#a3e635" stroke-opacity=".7" stroke-width="1.5"/><rect x="510.8" y="90" width="5" height="72" rx="2" fill="#a3e635"/><text x="526.8" y="108" font-size="16" fill="#e2e8f0" font-weight="700">Serve</text><text x="526.8" y="130" font-size="13" fill="#94a3b8">/api/* + /ws</text><text x="526.8" y="148" font-size="10.4" fill="#64748b">one display API</text>
<rect class="motion" x="496.8" y="74" width="206.4" height="104" rx="14" fill="none" stroke="#a3e635" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.18;1" dur="4.5s" begin="1.8s" repeatCount="indefinite"/></rect>
<path d="M705.2 126 L723.2 126" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="725.2" y="74" width="206.4" height="104" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".7" stroke-width="1.5"/><rect x="739.2" y="90" width="5" height="72" rx="2" fill="#a78bfa"/><text x="755.2" y="108" font-size="16" fill="#e2e8f0" font-weight="700">Render</text><text x="755.2" y="130" font-size="13" fill="#94a3b8">four surfaces</text><text x="755.2" y="148" font-size="10.4" fill="#64748b">console · Observatory · TUI</text>
<rect class="motion" x="725.2" y="74" width="206.4" height="104" rx="14" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.18;1" dur="4.5s" begin="2.7s" repeatCount="indefinite"/></rect>
<path d="M933.6 126 L951.6 126" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="953.6" y="74" width="206.4" height="104" rx="14" fill="#0f172a" stroke="#fb923c" stroke-opacity=".7" stroke-width="1.5"/><rect x="967.6" y="90" width="5" height="72" rx="2" fill="#fb923c"/><text x="983.6" y="108" font-size="16" fill="#e2e8f0" font-weight="700">Act</text><text x="983.6" y="130" font-size="13" fill="#94a3b8">review resolve</text><text x="983.6" y="148" font-size="10.4" fill="#64748b">to the producer API</text>
<rect class="motion" x="953.6" y="74" width="206.4" height="104" rx="14" fill="none" stroke="#fb923c" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.18;1" dur="4.5s" begin="3.6s" repeatCount="indefinite"/></rect>
<circle class="motion" r="5" fill="#7dd3fc" filter="url(#soft)"><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite"><mpath href="#chain"/></animateMotion></circle>
<text x="40" y="208" font-size="13" fill="#8b9bb4" font-weight="700" letter-spacing="3">WHAT IT READS AND WHERE IT RUNS</text>
<g opacity=".92"><rect x="40" y="222" width="206.4" height="92" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="54" y="238" width="5" height="60" rx="2" fill="#f472b6"/><text x="70" y="256" font-size="15" fill="#e2e8f0" font-weight="700">llm-mailroom</text><text x="70" y="278" font-size="13" fill="#94a3b8">Langfuse traces</text><text x="70" y="296" font-size="12" fill="#64748b">the default producer</text></g>
<g opacity=".92"><rect x="268.4" y="222" width="206.4" height="92" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="282.4" y="238" width="5" height="60" rx="2" fill="#f472b6"/><text x="298.4" y="256" font-size="15" fill="#e2e8f0" font-weight="700">mailroom-reloaded</text><text x="298.4" y="278" font-size="13" fill="#94a3b8">Phoenix spans</text><text x="298.4" y="296" font-size="12" fill="#64748b">mailroom.node.*</text></g>
<g opacity=".92"><rect x="496.8" y="222" width="206.4" height="92" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="510.8" y="238" width="5" height="60" rx="2" fill="#f472b6"/><text x="526.8" y="256" font-size="15" fill="#e2e8f0" font-weight="700">Dojo</text><text x="526.8" y="278" font-size="13" fill="#94a3b8">optional [eval]</text><text x="526.8" y="296" font-size="12" fill="#64748b">offline evaluation</text></g>
<g opacity=".92"><rect x="725.2" y="222" width="206.4" height="92" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="739.2" y="238" width="5" height="60" rx="2" fill="#f472b6"/><text x="755.2" y="256" font-size="15" fill="#e2e8f0" font-weight="700">HF Space</text><text x="755.2" y="278" font-size="13" fill="#94a3b8">live Observatory</text><text x="755.2" y="296" font-size="12" fill="#64748b">public Docker Space</text></g>
<g opacity=".92"><rect x="953.6" y="222" width="206.4" height="92" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity=".7" stroke-width="1.5"/><rect x="967.6" y="238" width="5" height="60" rx="2" fill="#f472b6"/><text x="983.6" y="256" font-size="15" fill="#e2e8f0" font-weight="700">GH Pages</text><text x="983.6" y="278" font-size="13" fill="#94a3b8">terminal site</text><text x="983.6" y="296" font-size="12" fill="#64748b">static snapshot</text></g>
</svg>
