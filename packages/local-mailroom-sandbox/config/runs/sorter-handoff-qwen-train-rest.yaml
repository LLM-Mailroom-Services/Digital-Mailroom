# The 37 train documents sorter-handoff-qwen-train did not reach: its API cap prices every token
# at the highest model the openrouter profile can call (deepseek-v4-flash, $0.05/$0.25), so it
# stopped at an estimated $2.00 after 2,942 documents (list cost at qwen's $0.03/$0.13: $1.19).
# The rows are that run's locked dataset rows (data/runtime/handoff/sorter-train-remaining.jsonl).
# Reviewer runs take handoff_run: [sorter-handoff-qwen-train, sorter-handoff-qwen-train-rest].
#
# SAND-085: the sorter's answer for every train document (2979), so the decision reviewer can be
# calibrated on the real sorter handoff (question set 3.0.0). Sorter only (task: isolated), on
# the pipeline's sorter configuration: qwen/qwen3.7-flash, the whole document in one call
# (max_input_chars 600,000). Qwen3.7 Flash lists $0.03 in / $0.13 out per 1M tokens.
schema: sandbox.run/v1
run_id: sorter-handoff-qwen-train-rest
task: isolated
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: file
  local_path: data/runtime/handoff/sorter-train-remaining.jsonl
  config: ground_truth
  split: train

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_knobs:
  sorter: {max_input_chars: 600000}

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 24
  cost_cap_usd: 0.50
  max_wall_seconds: 5400
  api_cost_cap_usd: 0.50

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, sorter-handoff]
