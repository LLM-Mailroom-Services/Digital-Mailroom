# Operator desk — single front door. nginx :80 is the ONLY published port.
# Both app services run the `operator` image target (operator extras + baked
# ui/dist served at /desk). Langfuse stays the US-cloud document-display
# source — this file does not stand up a local Langfuse.
#
# Required env (fail fast — compose refuses to start without them):
#   MAILROOM_OPERATOR_JWT_SECRET, MAILROOM_OPERATOR_ADMIN_PASSWORD
# Optional: MAILROOM_OPERATOR_INGEST_TOKEN (standalone observer ingest),
# MAILROOM_EDITION, MAILROOM_OBSERVER, LANGFUSE_*, MAILROOM_PIPELINE_*.

services:
  mailroom:
    build:
      context: ..
      dockerfile: Dockerfile
      target: operator
      args:
        MAILROOM_EXTRAS: operator
    container_name: mailroom-visualizer
    environment:
      - MAILROOM_EDITION=${MAILROOM_EDITION:-console}
      - MAILROOM_HOST=0.0.0.0
      - MAILROOM_PORT=8001
      - MAILROOM_BASE_DIR=/data
      - MAILROOM_OPERATOR_DB=/data/operator.db
      - MAILROOM_OPERATOR_JWT_SECRET=${MAILROOM_OPERATOR_JWT_SECRET:?set MAILROOM_OPERATOR_JWT_SECRET in .env}
      - MAILROOM_OPERATOR_ADMIN_PASSWORD=${MAILROOM_OPERATOR_ADMIN_PASSWORD:?set MAILROOM_OPERATOR_ADMIN_PASSWORD in .env}
      - MAILROOM_OPERATOR_INGEST_TOKEN=${MAILROOM_OPERATOR_INGEST_TOKEN:-}
      - MAILROOM_OBSERVER=${MAILROOM_OBSERVER:-1}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - MAILROOM_PIPELINE_URL=${MAILROOM_PIPELINE_URL:-}
      - MAILROOM_PIPELINE_TOKEN=${MAILROOM_PIPELINE_TOKEN:-}
    volumes:
      - mailroom-data:/data
    # No ports: nginx is the only published front door.
    command: python -m server.main

  mailroom-observer:
    build:
      context: ..
      dockerfile: Dockerfile
      target: operator
      args:
        MAILROOM_EXTRAS: operator
    container_name: mailroom-observer
    environment:
      - MAILROOM_BASE_DIR=/data
      - MAILROOM_OPERATOR_DB=/data/operator.db
      - MAILROOM_API_URL=http://mailroom:8001
      - MAILROOM_OPERATOR_INGEST_TOKEN=${MAILROOM_OPERATOR_INGEST_TOKEN:-}
      - MAILROOM_OBSERVER=0
    volumes:
      - mailroom-data:/data
    command: python -m operator_desk.observer
    depends_on:
      mailroom:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: mailroom-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      # nginx resolves `mailroom` at boot — wait for the backend to be up,
      # otherwise the unresolvable upstream kills the container.
      mailroom:
        condition: service_healthy

volumes:
  mailroom-data:
