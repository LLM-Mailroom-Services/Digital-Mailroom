# Granite probe — contracts_specialist on 1 CONTRACT doc (FP8, 1×L4).
# SEPARATE instance from run-20-contracts-granite: own run dir, items,
# serving record, and report section. Probe metrics never merge into
# full-run aggregates. HALT-gated: full 20 proceeds only on probe PASS
# (ok + schema-valid + wall < 300s).
#
# Same warm app as the sweep — do NOT redeploy/teardown around this probe:
#   sandbox run benchmark-check --config config/runs/run-01-contracts-granite-probe.yaml
#   sandbox run preflight --config config/runs/run-01-contracts-granite-probe.yaml --live
#   sandbox run start --config config/runs/run-01-contracts-granite-probe.yaml --job-mode endpoint --watch
schema: sandbox.run/v1
run_id: run-01-contracts-granite-probe
task: contracts_specialist
profile: modal-vllm

prompt:
  # DMR-074 local pin (config/prompts/contracts_specialist_v33_simplified.txt) —
  # same file as run-20-contracts-granite.
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: test — same pool as run-20-contracts-granite; 1 service doc, seed 42
  split: test
  revision: ed7576b676343e0b402ec5412cded301e629bdee   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      - doc_class: contract
        sub_buckets:
          - {subclass: service, count: 1}              # avail 8
  limit: 1
  sample_seed: 42

engine:
  kind: modal-vllm
  model: ibm-granite/granite-4.2-8b-fp8
  vllm:
    max_model_len: 32768      # FP8 L4 window (bf16 Granite 32k FAILS on 1×L4)
    gpu_memory_utilization: 0.90
    max_num_seqs: 6              # L4 long-prompt: 4–6 (cliff at ~8 × ~8k)
    enable_prefix_caching: true
    enforce_eager: true
    quantization: compressed-tensors
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120    # attended cost-saver (DMR-076)
    max_containers: 1         # 1×L4 cost guard — do not raise for Granite runs
    min_containers: 1         # pinned warm (same app as the sweep chain)
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 1              # probe is serial by design (*-probe exempt from c>=2)
  cost_cap_usd: 0.10          # single-doc probe guard
  max_wall_seconds: 900       # single-doc probe guard

trace:
  sink: none
  otlp: false
  environment: specialist-01-contracts-granite-probe
  tags: [sandbox, job, specialist, contracts, granite-fp8, l4, probe, c1]
