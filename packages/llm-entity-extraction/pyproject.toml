[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-entity-extraction"
version = "0.21.0"
description = "LangChain agents (sorter, specialists, judge) + prompt experiment loop for legal document classification and entity extraction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=0.3",
    "openai>=1.60",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@v0.16.0",
]

[project.optional-dependencies]
tracing = [
    "arize-phoenix>=4.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "langfuse>=3.0",
]
evals = ["braintrust>=0.31"]
datasets = ["huggingface_hub>=0.24", "Pillow>=10.4.0", "pdf2image>=1.17"]
reporting = ["numpy>=1.26.0", "matplotlib>=3.9.0", "openpyxl>=3.1"]
embeddings = ["sentence-transformers>=3.0"]
notebooks = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]
deploy = ["modal==1.5.5"]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "llm-entity-extraction[tracing]"]
all = ["llm-entity-extraction[tracing,evals,datasets,reporting,embeddings,notebooks,deploy]"]
pdf = ["llm-entity-extraction[datasets]"]

[tool.setuptools]
packages = ["agents", "src", "config"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.uv.sources]
llm-dojo-scoring = { workspace = true }
