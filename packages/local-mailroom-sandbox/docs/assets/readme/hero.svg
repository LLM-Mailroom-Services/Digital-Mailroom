<text x="600" y="44" font-size="13" fill="#8b9bb4" font-weight="700" text-anchor="middle" letter-spacing="3">THE MAILROOM CONSTELLATION · THE SANDBOX</text><ellipse cx="600" cy="116" rx="420" ry="70" fill="url(#glow)" opacity=".18"/><text x="600" y="126" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#ttl)">local-mailroom-sandbox</text><text x="600" y="170" font-size="20" fill="#cbd5e1" text-anchor="middle">Run the whole mailroom on your own machine — or on a rented GPU — and score every run.</text><text x="600" y="202" font-size="13" fill="#8b9bb4" font-weight="600" text-anchor="middle" letter-spacing="3">SEVEN PROVIDER PROFILES · VENDORED PIPELINE + DOJO · MOCK FIRST · LIVE OR LOUD</text><text x="150" y="232" font-size="11" fill="#8b9bb4" font-weight="700" letter-spacing="2">PROVIDER PROFILES</text>
