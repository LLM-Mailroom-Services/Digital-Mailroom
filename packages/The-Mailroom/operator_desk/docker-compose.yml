# Operator-desk sidecar around the existing The-Mailroom visualizer.
# Pixel console + Observatory stay vanilla (no Node/React UI).
# Langfuse stays the document-display source — this file does not stand up a
# Langfuse. Point LANGFUSE_HOST at US cloud (default) or at the
# local-mailroom-sandbox stack (http://host.docker.internal:3000).
#
# The stack binds 0.0.0.0, so the operator desk fails closed on local-dev
# defaults: set these in .env first (compose refuses to start without them):
#   MAILROOM_OPERATOR_JWT_SECRET      (long random string)
#   MAILROOM_OPERATOR_ADMIN_PASSWORD  (not "changeme")
#   MAILROOM_OPERATOR_INGEST_TOKEN    (shared by mailroom + mailroom-observer)

services:
  mailroom:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mailroom-visualizer
    environment:
      - MAILROOM_EDITION=${MAILROOM_EDITION:-console}
      - MAILROOM_HOST=0.0.0.0
      - MAILROOM_PORT=8001
      - MAILROOM_BASE_DIR=/data
      - MAILROOM_OPERATOR_DB=/data/operator.db
      - MAILROOM_OPERATOR_JWT_SECRET=${MAILROOM_OPERATOR_JWT_SECRET:?set MAILROOM_OPERATOR_JWT_SECRET}
      - MAILROOM_OPERATOR_ADMIN_PASSWORD=${MAILROOM_OPERATOR_ADMIN_PASSWORD:?set MAILROOM_OPERATOR_ADMIN_PASSWORD}
      - MAILROOM_OPERATOR_INGEST_TOKEN=${MAILROOM_OPERATOR_INGEST_TOKEN:?set MAILROOM_OPERATOR_INGEST_TOKEN}
      # The mailroom-observer sidecar below watches the bins; running the
      # in-process observer as well emitted every event twice.
      - MAILROOM_OBSERVER=${MAILROOM_OBSERVER:-0}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
      - MAILROOM_PIPELINE_URL=${MAILROOM_PIPELINE_URL:-}
      - MAILROOM_PIPELINE_TOKEN=${MAILROOM_PIPELINE_TOKEN:-}
    volumes:
      - mailroom-data:/data
    ports:
      - "8001:8001"
    command: python -m server.main

  mailroom-observer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mailroom-observer
    environment:
      - MAILROOM_BASE_DIR=/data
      - MAILROOM_OPERATOR_DB=/data/operator.db
      - MAILROOM_API_URL=http://mailroom:8001
      - MAILROOM_OPERATOR_INGEST_TOKEN=${MAILROOM_OPERATOR_INGEST_TOKEN:?set MAILROOM_OPERATOR_INGEST_TOKEN}
      - MAILROOM_OBSERVER=0
    volumes:
      - mailroom-data:/data
    command: python -m operator_desk.observer
    depends_on:
      - mailroom

  mailroom-ui:
    profiles: ["ui"]
    build:
      context: ../ui
      dockerfile: Dockerfile
    container_name: mailroom-ui
    ports:
      - "5174:80"
    depends_on:
      - mailroom

  nginx:
    image: nginx:alpine
    container_name: mailroom-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mailroom

volumes:
  mailroom-data:
