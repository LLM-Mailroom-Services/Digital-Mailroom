<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" role="img" aria-labelledby="t d">
<title id="t">Where extraction confidence routes a document</title>
<desc id="d">Banded bars per class on a 0.80 to 1.00 axis. Below low: retry. Low to judge_band_high: judge. At or above judge_band_high: accept. contract, merger_agreement, insurance_claim 0.90 and 0.97; global 0.88 and 0.95; corporate_record 0.86 and 0.94; correspondence 0.85 and 0.92.</desc>
