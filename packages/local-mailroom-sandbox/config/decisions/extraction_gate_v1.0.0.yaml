# Extraction quality gate, question set 1.0.0 (Decisions API, openai/gpt-6-luna-decisions).
# The gate sits after a specialist: state = {document, extraction_handoff}; it decides whether the
# extraction can go on (accept), needs another specialist pass (retry_extraction) or a person
# (human_review). One yes/no support question per key field of the document's class.
# Ground truth for calibration: the dojo extraction score of the same extraction against the
# row's expected_fields (scripts/extraction_gate.py calibrate). Calibrated on mailroom-dataset
# ground_truth rows of all five classes with real specialist extractions
# (qwen/qwen3.7-flash); never on mock or ground-truth-echo predictions.
kind: extraction_gate
version: 1.0.0
handoff: extraction
max_input_chars: 120000
verdict:
  instructions: >-
    The state holds a document and a structured extraction another model produced from it
    (extraction_handoff.fields). Judge the extraction against the document only: may it be
    passed on as it is?
  criteria:
    accept: >-
      Every filled value is supported by the document, and no key field the document clearly
      states is missing or wrong. Minor wording differences in a summary are fine.
    retry_extraction: >-
      At least one value is wrong, invented, or attributed to the wrong party, or a key field the
      document clearly states is empty or missing; a second extraction pass could fix it.
    human_review: >-
      The extraction cannot be checked: the document is unreadable or truncated, it is not the
      document class the extraction assumes, or the facts are too ambiguous to judge.
human_verdicts: [human_review]
field_instructions: >-
  Look only at the field "{field}" of extraction_handoff.fields ({meaning}). Is it right for this
  document? Yes when its value is supported by the document, or the document does not state it and
  the field is empty. No when the value is wrong, invented, or empty although the document states it.
fields:
  insurance_claim:
    claim_number: the claim reference or notice ID
    policy_number: the policy number
    insured_party: the insured person or beneficiary
    insurer: the insurance company or payer
    date_of_loss: the date of loss or service
    claimed_amount: the amount claimed
    claim_type: the line of insurance or CMS claim type
    coverage_determination: the coverage outcome (approved, denied, pending, ...)
  corporate_record:
    # Entity extraction (llm_dojo_scoring corporate_record schema; per-subclass alignment drops
    # key-entity fields the dataset never labeled) ...
    record_type: the record the document's own title names (bylaws, charter amendment, officer's certificate, ...)
    entity_name: the company the record is for
    jurisdiction: the state or country of incorporation or filing
    effective_date: the date the record is adopted, filed or takes effect
    filing_number: a filing, file or registration number the document states
    signatories: the people who sign or certify the record, by name
    # ... and the grounded summary fields every corporate row labels.
    subject_matter: a one-sentence statement of what the record does
    intent: the record's purpose label
    keywords: the salient names, terms and identifiers in the record
  correspondence:
    # Only fields the correspondence specialist emits (it has no content_topic / sentiment_label).
    subject_matter: a one-sentence statement of what the message is about
    intent: what the sender wants or is doing (inform, request, schedule, demand, ...)
    keywords: the salient names, terms and identifiers in the message
    communication_type: the form of the message (email, letter, memo, notice, press release, ...)
    sender: who sent the message
    recipient: who the message is addressed to
    communication_date: the date the message was sent
  contract:
    # Entity extraction (truth: the CUAD spans for these categories) ...
    document_name: the agreement's title as the document gives it
    parties: every contracting party, by name
    effective_date: the date the agreement takes effect
    governing_law: the jurisdiction whose law governs the agreement
    term_length: the agreement's term or expiration date
    renewal_terms: how and for how long the agreement renews, if it does
    # ... and the native question-structured extraction (truth: CUAD clause labels).
    cuad_clauses: "the CUAD clause categories the agreement contains, as '<Category>: <evidence>' (e.g. Exclusivity, Non-Compete, Cap On Liability); right only when the listed categories are present and no clearly present category is missing"
  merger_agreement:
    # Entity extraction ...
    document_name: the agreement's title (e.g. Agreement and Plan of Merger)
    parties: Parent, Merger Sub and Target as the document names them, with no invented roles
    effective_date: the Effective Date when a calendar date is stated (empty when only an Effective Time is defined)
    effective_time: the Effective Time as written
    governing_law: the governing-law jurisdiction
    merger_consideration: what each share of the target's common stock converts into (all_cash, all_stock, mixed_cash_stock, mixed_cash_stock_election, other), from the conversion section
    # ... and the native question-structured extraction (truth: MAUD answers).
    maud_clauses: "the answered LegalBench MAUD questions as '<Question>: <Answer>' (No-Shop, MAE Definition, closing conditions, ...); right only when every listed answer matches the agreement's text"
# A merger agreement is far longer than the other classes (median ~340k chars); the gate reads more of it.
max_input_chars_by_class:
  merger_agreement: 240000
