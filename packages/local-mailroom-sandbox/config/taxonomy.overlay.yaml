# Local-first overlay applied on top of mailroom's shipped taxonomy.yaml.
# Profile rewrite sets every agent's provider/model first. Agent keys listed
# here (temperature, max_tokens, max_input_chars, reasoning_effort, and an
# optional model) win after that rewrite. CLI --agent-model wins last.

vision:
  enabled: true
  models:
    - "qwen/"
    - "qwen3"
    - "llava"
    - "llama-3.2"
    - "gpt-4o"
    - "gemini"
    - "claude"

cost_models:
  qwen3:8b:
    input_per_million: 0.0
    output_per_million: 0.0
  qwen3:7b:
    input_per_million: 0.0
    output_per_million: 0.0
  Qwen/Qwen3-8B:
    input_per_million: 0.0
    output_per_million: 0.0
  llama3.1:8b:
    input_per_million: 0.0
    output_per_million: 0.0
  deepseek-r1:8b:
    input_per_million: 0.0
    output_per_million: 0.0

# DMR-072: run-level limits — 900s was too high for idle; 600s holds L4
# saturation bursts (queue + decode under concurrency 4–5). The vendored
# 120s default cannot hold an L4 generation at all — the pin belongs HERE
# (overlay), not in the drift-guarded vendored file.
run_limits:
  llm_call_timeout_seconds: 600

# Surgical knobs — overlay wins after profile rewrite. Omit `model` to keep
# the mapped local tag from the active profile.
# DMR-078: specialist max_tokens / max_input_chars from specialist_posture
# (fit Qwen/Qwen3-8B on L4 max_model_len=16384; short docs avoid over-prefill).
agents:
  sorter:
    temperature: 0.1
    max_tokens: 2048
    max_input_chars: 12000
    reasoning_effort: "none"
  sorter_reviewer:
    temperature: 0.1
    max_tokens: 2048
    max_input_chars: 12000
    reasoning_effort: "none"
  arbiter:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 100000
    reasoning_effort: "none"
  contracts_specialist:
    temperature: 0.1
    # SAND-018: 4096 decode (2048 truncated contract JSON). Input cap sized for
    # the measured ~2.4 chars/token of dense filings AND the ~3100-token v33
    # prompt overhead: 18000 chars ≈ 7500 tokens + 4096 decode + 4000 reserve
    # ≤ 16384. (35000 chars = 14337 tokens, 24000 = 12289 — both 400 the 16k
    # window; raising the window to 32k for AWQ is the follow-up to restore it.)
    max_tokens: 4096
    max_input_chars: 18000
    reasoning_effort: "none"
  merger_agreement_specialist:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 36008
    reasoning_effort: "none"
  corporate_records_specialist:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 21875
    reasoning_effort: "none"
  correspondence_specialist:
    temperature: 0.1
    max_tokens: 2048
    max_input_chars: 15312
    reasoning_effort: "none"
  insurance_claims_specialist:
    temperature: 0.1
    max_tokens: 3072
    max_input_chars: 19687
    reasoning_effort: "none"
  reporter:
    temperature: 0.2
    max_tokens: 3072
    max_input_chars: 40000
    reasoning_effort: "none"
  boss:
    temperature: 0.1
    max_tokens: 8192
    max_input_chars: 40000
    reasoning_effort: "none"
  pdf_transcriber:
    temperature: 0.1
    max_tokens: 8192
    max_input_chars: 40000
    reasoning_effort: "none"
  image_extractor:
    temperature: 0.1
    max_tokens: 4096
    max_input_chars: 20000
    reasoning_effort: "none"
  judge:
    temperature: 0.0
    max_tokens: 4096
    max_input_chars: 80000
    reasoning_effort: "none"
