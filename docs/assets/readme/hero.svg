<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"
     font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">The Digital Mailroom</title>
  <desc id="d">Animated banner: envelopes ride a conveyor belt through six gates (intake, classify, extract, judge, compile, archive) beneath The Digital Mailroom title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#151036"/>
      <stop offset="1" stop-color="#22103a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f9a8d4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <g id="env">
      <rect x="-22" y="-30" width="44" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <polyline points="-22,-30 0,-13 22,-30" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="-13" r="3.2" fill="#ef4444"/>
    </g>
    <path id="belt" d="M40 312 H1160"/>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#e0e7ff">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="38" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="82" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="46" r="1.7"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="92" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="54" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="30" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="190" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="200" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <ellipse cx="600" cy="118" rx="420" ry="70" fill="url(#glow)" opacity="0.18"/>
  <text x="600" y="128" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#title)"><tspan font-weight="300" font-style="italic">The </tspan>Digital Mailroom</text>
  <text x="600" y="172" text-anchor="middle" font-size="20" fill="#cbd5e1">Every legal document gets a ticket, a sorter, a second opinion — and a receipt.</text>
  <text x="600" y="204" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="3" fill="#8b9bb4">ONE CHECKOUT · FIVE CORE PACKAGES · ONE LOCKFILE</text>

  <!-- conveyor belt -->
  <line x1="40" y1="318" x2="1160" y2="318" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <line x1="40" y1="318" x2="1160" y2="318" stroke="#64748b" stroke-width="2" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <g fill="#1e293b" stroke="#475569" stroke-width="2">
    <circle cx="60" cy="334" r="9"/><circle cx="240" cy="334" r="9"/><circle cx="420" cy="334" r="9"/>
    <circle cx="600" cy="334" r="9"/><circle cx="780" cy="334" r="9"/><circle cx="960" cy="334" r="9"/><circle cx="1140" cy="334" r="9"/>
  </g>

  <!-- gate tops (glow as each envelope passes; envelopes run every 2 s at 180 px/s from x=60) -->
  <g font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <g>
      <rect x="130" y="244" width="100" height="24" rx="6" fill="#0ea5e9"><animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="2s" begin="0.67s" repeatCount="indefinite"/></rect>
      <text x="180" y="261" fill="#0b1220">INTAKE</text>
    </g>
    <g>
      <rect x="310" y="244" width="100" height="24" rx="6" fill="#22c55e"><animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="2s" begin="1.67s" repeatCount="indefinite"/></rect>
      <text x="360" y="261" fill="#0b1220">CLASSIFY</text>
    </g>
    <g>
      <rect x="490" y="244" width="100" height="24" rx="6" fill="#a3e635"><animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="2s" begin="2.67s" repeatCount="indefinite"/></rect>
      <text x="540" y="261" fill="#0b1220">EXTRACT</text>
    </g>
    <g>
      <rect x="670" y="244" width="100" height="24" rx="6" fill="#c084fc"><animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="2s" begin="3.67s" repeatCount="indefinite"/></rect>
      <text x="720" y="261" fill="#0b1220">JUDGE</text>
    </g>
    <g>
      <rect x="850" y="244" width="100" height="24" rx="6" fill="#fb923c"><animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="2s" begin="4.67s" repeatCount="indefinite"/></rect>
      <text x="900" y="261" fill="#0b1220">COMPILE</text>
    </g>
    <g>
      <rect x="1030" y="244" width="100" height="24" rx="6" fill="#f472b6"><animate attributeName="opacity" values="1;0.35;0.35" keyTimes="0;0.35;1" dur="2s" begin="5.67s" repeatCount="indefinite"/></rect>
      <text x="1080" y="261" fill="#0b1220">ARCHIVE</text>
    </g>
  </g>

  <!-- envelopes -->
  <g>
    <use href="#env"><animateMotion dur="6s" repeatCount="indefinite" begin="0s"><mpath href="#belt"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.94;1" dur="6s" begin="0s" repeatCount="indefinite"/></use>
    <use href="#env"><animateMotion dur="6s" repeatCount="indefinite" begin="2s"><mpath href="#belt"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.94;1" dur="6s" begin="2s" repeatCount="indefinite"/></use>
    <use href="#env"><animateMotion dur="6s" repeatCount="indefinite" begin="4s"><mpath href="#belt"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.94;1" dur="6s" begin="4s" repeatCount="indefinite"/></use>
  </g>

  <!-- gate posts drawn over the envelopes so they pass "through" -->
  <g fill="#94a3b8" opacity="0.85">
    <rect x="132" y="268" width="6" height="44"/><rect x="222" y="268" width="6" height="44"/>
    <rect x="312" y="268" width="6" height="44"/><rect x="402" y="268" width="6" height="44"/>
    <rect x="492" y="268" width="6" height="44"/><rect x="582" y="268" width="6" height="44"/>
    <rect x="672" y="268" width="6" height="44"/><rect x="762" y="268" width="6" height="44"/>
    <rect x="852" y="268" width="6" height="44"/><rect x="942" y="268" width="6" height="44"/>
    <rect x="1032" y="268" width="6" height="44"/><rect x="1122" y="268" width="6" height="44"/>
  </g>

  <text x="600" y="384" text-anchor="middle" font-size="13" fill="#8b9bb4">13-node LangGraph pipeline · deterministic scoring · pixel-art visualizer · offline sandbox · corpus EDA</text>
</svg>
