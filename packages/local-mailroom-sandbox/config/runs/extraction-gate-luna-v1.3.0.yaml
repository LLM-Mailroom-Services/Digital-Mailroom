# Extraction gate question set 1.3.0 (per-template rules) over EVERY collected extraction: the 880
# 1.2.0 re-reviewed, the 686 insurance round-3 extractions and the 30 merger agreements (baseline +
# round 2, for the interim merger labels; dojo #95), 1,596 documents. No new extraction: the
# handoffs are the existing specialist runs. Calibration subclass = the labelled subclass (oracle
# sorter); the pipeline passes the sorter's subclass in the handoff.
#
#   sandbox run start --config config/runs/extraction-gate-luna-v1.3.0.yaml --initials XX
#   python scripts/extraction_gate.py calibrate --run extraction-gate-luna-v1.3.0 --key-set extraction_gate_v1.2.0
#
# Cost: Decisions bills input only ($0.10 per 1M). 1.2.0 cost $0.41 (880) + $0.25 (686); the 30
# mergers cost $0.15 in 1.1.0 (~$0.23 at full length); 1.3.0 questions are shorter per document.
# Estimate ~$0.90, cap $1.10.
schema: sandbox.run/v1
run_id: extraction-gate-luna-v1.3.0
task: extraction_gate
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: file
  local_path: data/runtime/handoff/gate-train-v1.3.0.jsonl
  config: ground_truth
  split: train

engine:
  kind: openrouter
  model: openai/gpt-6-luna-decisions
  modal: null

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: extraction_gate_v1.3.0
  handoff_run:
    - extraction-gate-specialist-insurance-claim-qwen
    - extraction-gate-specialist-corporate-record-qwen
    - extraction-gate-specialist-correspondence-qwen
    - extraction-gate-specialist-contract-qwen
    - extraction-gate-specialist-insurance-claim-qwen-r2
    - extraction-gate-specialist-corporate-record-qwen-r2
    - extraction-gate-specialist-correspondence-qwen-r2
    - extraction-gate-specialist-contract-qwen-r2
    - extraction-gate-specialist-insurance-claim-qwen-r3
    - extraction-gate-specialist-merger-agreement-qwen
    - extraction-gate-specialist-merger-agreement-qwen-r2

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 12
  cost_cap_usd: 1.00
  max_wall_seconds: 3600
  api_cost_cap_usd: 1.10

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, extraction-gate, decisions-api, extraction-gate-1.3.0]
