# SAND-040 scale run — contracts_specialist · n=100 · 2×L4 · C32 (16 per replica) · one 32K deploy, SAND-037 spec unchanged.
# Same dataset/prompt blocks as grid-50-contracts-specialist-awq-2l4-rerun except n.
# Decode: max_tokens 8192 + temperature 0.7 via start-time SANDBOX_AGENT_KNOBS (JSON-schema grammar class).
# Runbook: sandbox runbook show sand40
schema: sandbox.run/v1
run_id: sand40-100-contracts-specialist-awq-2l4
task: contracts_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - {doc_class: contract, count: 100}   # single class bucket → nested 20 ⊂ 50 ⊂ 100 (seed 42)
  limit: 100
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: "awq_marlin"
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 32
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 2
    min_containers: 2
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 32
  cost_cap_usd: 1.2
  max_wall_seconds: 3600

trace:
  sink: none
  otlp: false
  environment: qwen-sand40
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, grid, sand40]
