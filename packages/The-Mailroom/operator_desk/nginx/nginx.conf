events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    upstream mailroom {
        server mailroom:8001;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # One front door for the whole visualizer. Every location forwards the
    # browser's own Host ($http_host keeps a non-80 port) so the server's
    # same-origin write guard accepts the operator's POSTs, plus the client
    # address for the debug/audit logs.
    server {
        listen 80;
        server_name _;
        client_max_body_size 40m;   # inbox uploads (server caps at 32 MB)

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://mailroom;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /v1/ {
            proxy_pass http://mailroom;
            proxy_read_timeout 300s;
        }

        # /ws (floor snapshots) and /ws/pipeline (operator bin events).
        location /ws {
            proxy_pass http://mailroom;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # React operator desk (baked into the image at ui/dist, base /desk/).
        # Plain proxy_pass — the visualizer serves the SPA and its fallback.
        location /desk {
            proxy_pass http://mailroom;
        }

        # Pixel console /, Observatory /live, /static, /health.
        # No try_files: with no local root it looped on internal redirects
        # and answered 500 for every page.
        location / {
            proxy_pass http://mailroom;
        }
    }

    # TLS: terminate here by adding a server block like the one below (or put
    # a TLS proxy in front and keep X-Forwarded-Proto). Certificates are
    # deployment-specific, so this stays commented out.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name mailroom.example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ... same locations as above ...
    # }
}
