[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-sandbox"
version = "0.1.0"
description = "Local-first experiment sandbox for the LLM-Mailroom pipeline (Ollama, vLLM, llama.cpp)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pydantic>=2.0",
    "openai>=1.30",
    # Current family scoring pin (aligned with llm-mailroom v0.6.0's own pin).
    # mailroom stays off the core deps so offline installs stay lean — use
    # `sandbox fetch-deps` (source tree @ v0.6.0) or the `[pipeline]` extra.
    "llm-dojo-scoring @ git+https://github.com/Exios66/llm-dojo-scoring.git@v0.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
observability = [
    "langfuse>=4.0,<5",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
hf = [
    "huggingface_hub>=0.24",
    "pyarrow>=15.0",
]
deploy = [
    # Pinned SDK for deploy/modal_vllm.py (verified 2026-09-09; the app file
    # records the same version). Bump deliberately after reading the release
    # notes — 1.5.5 removed `Secret.from_local`.
    "modal==1.5.5",
]
# Current llm-mailroom release (v0.6.0 aligns with the family dojo pin).
pipeline = [
    "mailroom @ git+https://github.com/Exios66/llm-mailroom.git",
]
evals = [
    "llm-entity-extraction @ git+https://github.com/Exios66/llm-entity-extraction.git@v0.20.0",
]
gpu = [
    "mailroom-sandbox[deploy]",
]
all = [
    "mailroom-sandbox[dev,deploy,evals,hf,observability,notebooks]",
]

[project.scripts]
sandbox = "mailroom_sandbox.cli:main"
mailroom-sandbox = "mailroom_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mailroom_sandbox*"]

[tool.setuptools.package-data]
mailroom_sandbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_llm: live test against a local OpenAI-compatible server (skipped unless SANDBOX_LOCAL_LLM=1)",
]

# Monorepo dev: resolve family members from the workspace instead of the
# release git pins above. Plain `pip install .` keeps using the pins.
[tool.uv.sources]
llm-dojo-scoring = { workspace = true }
mailroom = { workspace = true }
llm-entity-extraction = { workspace = true }
