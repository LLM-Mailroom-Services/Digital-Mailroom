# Granite sweep 4/5 — correspondence_specialist on 20 CORRESPONDENCE docs (FP8, 1×L4).
# Subclass quotas identical to run-20-correspondence-specialist-awq
# (2/3 scale of run-30 quotas: 12→8 / 3→2) for a direct twin compare.
# Engine/posture: ibm-granite/granite-4.2-8b-fp8, 32768 window, 1×L4
# (Qwen twin ran 2×L4 — GPU $ scales accordingly), concurrency 3 (HALT revision, was 8),
# DMR-074 production prompt pin, scaledown 120, MIN=MAX=1 pinned warm.
#
# Same warm app — do NOT redeploy before this run:
#   sandbox run benchmark-check --config config/runs/run-20-correspondence-granite.yaml
#   sandbox run preflight --config config/runs/run-20-correspondence-granite.yaml --live
#   sandbox run start --config config/runs/run-20-correspondence-granite.yaml --job-mode endpoint --watch
#   # NO teardown here; cold boot measured on run 1 only (note reuse).
schema: sandbox.run/v1
run_id: run-20-correspondence-granite
task: correspondence_specialist
profile: modal-vllm

prompt:
  # DMR-074 local production pin (config/prompts/correspondence_specialist_production.txt) —
  # same file as the Qwen AWQ comparators (run-20/run-50-correspondence-specialist-awq).
  default: {source: code-default}
  agents:
    correspondence_specialist:
      source: local
      file: correspondence_specialist_production

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: test — 62 correspondence rows; N=20 fits (same pool as run-30)
  split: test
  revision: ed7576b676343e0b402ec5412cded301e629bdee   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      # correspondence: all 7 test subclasses → 20 (same as Qwen AWQ Run A)
      - doc_class: correspondence
        sub_buckets:
          - {subclass: email, count: 8}                # avail 30
          - {subclass: letter, count: 2}               # avail 9
          - {subclass: press_release, count: 2}        # avail 8
          - {subclass: memo, count: 2}                 # avail 5
          - {subclass: meeting_request, count: 2}      # avail 4
          - {subclass: demand, count: 2}               # avail 3
          - {subclass: notice, count: 2}               # avail 3
  limit: 20
  sample_seed: 42

engine:
  kind: modal-vllm
  model: ibm-granite/granite-4.2-8b-fp8
  vllm:
    max_model_len: 32768      # FP8 L4 window (bf16 Granite 32k FAILS on 1×L4)
    gpu_memory_utilization: 0.90
    max_num_seqs: 6              # L4 long-prompt: 4–6 (cliff at ~8 × ~8k)
    enable_prefix_caching: true
    enforce_eager: true
    quantization: compressed-tensors
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120    # attended cost-saver (DMR-076)
    max_containers: 1         # 1×L4 cost guard — do not raise for Granite runs
    min_containers: 1         # pinned warm across the five-run chain (no scale-to-zero)
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 3              # HALT revision: c=3 (KV math + DMR-072; was 8)
  cost_cap_usd: 0.40          # same as Qwen AWQ Run A (1-replica billing)
  max_wall_seconds: 2400      # same as Qwen AWQ Run A

trace:
  sink: none
  otlp: false
  environment: specialist-20-correspondence-granite
  tags: [sandbox, job, specialist, correspondence, granite-fp8, l4, benchmark, c8]
