# api-evals: contracts_specialist on 40 CONTRACT docs via OpenRouter API.
# COMPARABLE to the sandbox Modal run-20-contracts-specialist draw: the SAME
# strata/seed method (split=all, bucket contract count 40, seed 42, pinned
# revision), the SAME prompt stem (contracts_specialist_v33_simplified).
# profile=openrouter, model qwen/qwen3.7-flash (OpenRouter champion mapped to
# the Modal Qwen/Qwen3-8B row). Real API costs captured per item.
schema: sandbox.run/v1
run_id: api-contracts-40
task: contracts_specialist
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: 46a4d3c240a36671cde0182fff4960f6b8b73aca   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      - doc_class: contract
        count: 40
  limit: 40
  sample_seed: 42

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  vllm:
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 4
  cost_cap_usd: null
  max_wall_seconds: 3600

trace:
  sink: none
  otlp: false
  environment: api-evals
  tags: [sandbox, job, api-evals, specialist, contracts, openrouter, qwen3.7-flash]
