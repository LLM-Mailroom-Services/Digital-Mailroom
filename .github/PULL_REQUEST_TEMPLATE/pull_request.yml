name: Pull request
description: Standard PR form aligned with the hub board discipline (governance/TASKS.md + AGENTS.md)
title: "[PR]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Before opening

        - **Board first**: the card for this work exists on
          `governance/TASKS.md`, was labeled before the code (never after),
          and its status/Evidence are current.
        - **Commit discipline**: commits reference cards — `DMR-0NN: <summary>`
          (or `DMR-0NN claimed/reopened` in the message body). Board-touching
          commits (governance/, scripts/board_state.py, board-site/, .github/
          board templates) MUST use the DMR-0NN prefix — HUB-0NN prefixes
          belonged to the predecessor mailroom-dev board.
        - **Docs currency**: when a change alters behavior described by
          `README.md`, `AGENTS.md`, or `governance/TASKS.md`, those files are
          updated in the same commit.
  - type: input
    id: card
    attributes:
      label: Board card
      description: The DMR-0NN card this PR lands work for (one PR = one card scope; unrelated changes get their own PR)
      placeholder: "DMR-014"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this PR does and why — cite the card's task and any evidence (drift reports, suite results, human directives)
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related issues
      description: "e.g. #14, closes #14 (synced cards: the issue closes in the same commit that archives the card)"
  - type: checkboxes
    id: board
    attributes:
      label: Board discipline
      options:
        - label: "Card was claimed/labeled BEFORE the code (status + Evidence current on governance/TASKS.md)"
        - label: "Commits follow `DMR-0NN: <summary>` (HUB-0NN is never a new-work prefix)"
        - label: "Anything discovered but not delivered spawned its own card BEFORE this one closes"
        - label: "git status clean for the card's scope"
  - type: checkboxes
    id: verification
    attributes:
      label: Test gates (AGENTS.md)
      description: Suites run one package per pytest invocation — several packages ship a top-level `tests` package and collide when batched
      options:
        - label: "Surgically relevant suite green for every touched package"
        - label: "FULL suite green for touched packages (significant changes: packaging/imports, cross-cutting refactors, scoring)"
        - label: "`python scripts/board_state.py check` green"
        - label: "`python scripts/github_labels.py audit` green (if .github/labels.json or labels changed)"
  - type: checkboxes
    id: docs
    attributes:
      label: Docs currency
      options:
        - label: "README.md / AGENTS.md / governance/TASKS.md updated in the same commit where behavior they describe changed"
        - label: "Package-level docs (package AGENTS.md/README) updated if the package's behavior changed"
  - type: textarea
    id: notes
    attributes:
      label: Reviewer notes
      description: Edge cases, follow-ups, risk, suite counts (passed/failed numbers, not 'green')
