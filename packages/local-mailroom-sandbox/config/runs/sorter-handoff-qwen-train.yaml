# SAND-085: the sorter's answer for every train document (2979), so the decision reviewer can be
# calibrated on the real sorter handoff (question set 3.0.0). Sorter only (task: isolated), on
# the pipeline's sorter configuration: qwen/qwen3.7-flash, the whole document in one call
# (max_input_chars 600,000). Qwen3.7 Flash lists $0.03 in / $0.13 out per 1M tokens.
schema: sandbox.run/v1
run_id: sorter-handoff-qwen-train
task: isolated
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: train
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  sample_seed: 42

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_knobs:
  sorter: {max_input_chars: 600000}

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 24
  cost_cap_usd: 2.00
  max_wall_seconds: 5400
  api_cost_cap_usd: 2.00

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, sorter-handoff]
