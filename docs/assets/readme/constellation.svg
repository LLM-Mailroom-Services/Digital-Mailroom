<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d"
     font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">The Mailroom constellation</title>
  <desc id="d">Animated data-flow map. mailroom-corpus-eda publishes the mailroom-dataset to the Hugging Face Hub; local-mailroom-sandbox and llm-mailroom pull the pinned tag; the sandbox executes llm-mailroom; both score with llm-dojo-scoring; traces flow through Langfuse to The-Mailroom, the shared visualizer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#140f2e"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="e1" d="M260 110 H410"/>
    <path id="e2" d="M500 150 C470 210 400 220 360 260"/>
    <path id="e3" d="M560 150 C620 210 700 220 740 260"/>
    <path id="e4" d="M440 300 H650"/>
    <path id="e5" d="M360 340 C390 420 440 450 480 470"/>
    <path id="e6" d="M740 340 C700 420 650 450 610 470"/>
    <path id="e7" d="M870 310 C930 330 950 400 990 415"/>
    <path id="e8" d="M1080 385 V230"/>
    <path id="e9" d="M260 340 C250 680 1010 680 1080 455"/>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="3" fill="#8b9bb4">THE CONSTELLATION · HOW DATA MOVES</text>

  <!-- edges -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <use href="#e1" stroke="#38bdf8"/>
    <use href="#e2" stroke="#38bdf8"/><use href="#e3" stroke="#38bdf8"/>
    <use href="#e4" stroke="#a78bfa"/>
    <use href="#e5" stroke="#f59e0b"/><use href="#e6" stroke="#f59e0b"/>
    <use href="#e7" stroke="#f472b6" stroke-dasharray="6 6"/><use href="#e8" stroke="#f472b6" stroke-dasharray="6 6"/>
    <use href="#e9" stroke="#f472b6" stroke-dasharray="6 6"/>
  </g>
  <g font-size="12" fill="#94a3b8" font-style="italic">
    <text x="300" y="100">publishes</text>
    <text x="356" y="210">pinned pull</text>
    <text x="680" y="210">pinned pull</text>
    <text x="510" y="290">executes</text>
    <text x="352" y="440">scores with</text>
    <text x="680" y="440">scores with</text>
    <text x="872" y="394">traces</text>
    <text x="1092" y="312">feeds</text>
    <text x="637" y="594" text-anchor="middle">sandbox traces</text>
  </g>

  <!-- particles -->
  <g filter="url(#soft)">
    <circle r="5" fill="#7dd3fc"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="5" fill="#7dd3fc"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="5" fill="#7dd3fc"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="5" fill="#c4b5fd"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="5" fill="#fcd34d"><animateMotion dur="1.7s" begin="0.2s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    <circle r="5" fill="#fcd34d"><animateMotion dur="1.7s" begin="1.0s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
    <circle r="5" fill="#f9a8d4"><animateMotion dur="1.3s" repeatCount="indefinite"><mpath href="#e7"/></animateMotion></circle>
    <circle r="5" fill="#f9a8d4"><animateMotion dur="1.3s" begin="0.6s" repeatCount="indefinite"><mpath href="#e8"/></animateMotion></circle>
    <circle r="5" fill="#f9a8d4"><animateMotion dur="3.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#e9"/></animateMotion></circle>
  </g>

  <!-- nodes -->
  <g font-size="12" fill="#94a3b8">
    <!-- corpus-eda -->
    <rect x="40" y="70" width="220" height="80" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="58" y="100" font-size="16" font-weight="700" fill="#e2e8f0">mailroom-corpus-eda</text>
    <text x="58" y="122">EDA + centralized HF uploads</text>
    <text x="58" y="138" fill="#64748b">virtual member · no build</text>

    <!-- HF hub -->
    <rect x="410" y="70" width="240" height="80" rx="14" fill="#0f172a" stroke="#facc15" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="428" y="100" font-size="16" font-weight="700" fill="#fde68a">🤗 HF Hub</text>
    <text x="428" y="122">mailroom-dataset · v9</text>
    <text x="428" y="138" fill="#64748b">external · pinned tag</text>

    <!-- sandbox -->
    <rect x="220" y="260" width="220" height="80" rx="14" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <text x="238" y="290" font-size="16" font-weight="700" fill="#e2e8f0">local-mailroom-sandbox</text>
    <text x="238" y="312">offline/local + Modal/vLLM GPU</text>
    <text x="238" y="328" fill="#64748b">testing harness</text>

    <!-- llm-mailroom -->
    <rect x="650" y="260" width="220" height="80" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="2.5"/>
    <text x="668" y="290" font-size="16" font-weight="700" fill="#e2e8f0">llm-mailroom</text>
    <text x="668" y="312">13-node LangGraph pipeline</text>
    <text x="668" y="328" fill="#64748b">FastAPI producer</text>

    <!-- dojo -->
    <rect x="435" y="470" width="220" height="80" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="453" y="500" font-size="16" font-weight="700" fill="#e2e8f0">llm-dojo-scoring</text>
    <text x="453" y="522">ALL scoring engine + metrics</text>
    <text x="453" y="538" fill="#64748b">error analysis &amp; interpretation</text>

    <!-- langfuse -->
    <rect x="990" y="385" width="180" height="70" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1008" y="415" font-size="16" font-weight="700" fill="#fbcfe8">Langfuse</text>
    <text x="1008" y="437">external · trace store</text>

    <!-- The-Mailroom -->
    <rect x="980" y="150" width="200" height="80" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <text x="998" y="180" font-size="16" font-weight="700" fill="#e2e8f0">The-Mailroom</text>
    <text x="998" y="202">pixel-art visualizer</text>
    <text x="998" y="218" fill="#64748b">shared by pipeline + sandbox</text>
  </g>

  <!-- pulse on the pipeline -->
  <rect x="650" y="260" width="220" height="80" rx="14" fill="none" stroke="#22c55e" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;10;2" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- legend -->
  <g font-size="12" fill="#94a3b8">
    <rect x="40" y="520" width="16" height="12" rx="3" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="64" y="531">workspace member</text>
    <rect x="40" y="546" width="16" height="12" rx="3" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="64" y="557">external service</text>
  </g>
</svg>
