name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  network-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + pipeline surface for vendored imports)
        run: pip install -e ".[dev]"
      - name: Pytest (network-free; no SANDBOX_LOCAL_LLM)
        run: pytest -v -m "not local_llm"
      - name: Reports hub committed snapshot
        run: python reports/dashboard/build_hub.py --check
