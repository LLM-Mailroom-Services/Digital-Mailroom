# Qwen merger leg — contracts_specialist on 20 MERGER_AGREEMENT docs (AWQ, 1×L4).
# Cross-agent baseline per operator scope: the contracts_specialist (CUAD v33
# prompt) extracts MAUD merger docs, vs Granite's dedicated
# merger_agreement_specialist leg (run-20-merger-granite) — AGENT CONFOUND
# documented in the report; scores are not a pure model delta.
# Quotas mirror run-20-merger-granite (7/7/3/2/1, train split — test has
# only ~17 mergers) for doc-level comparability.
# Engine/posture: Qwen/Qwen3-8B-AWQ, 32768 window, 1×L4 MIN=MAX=1 pinned,
# concurrency 4 (NOT the c=8 legacy: merger prompts run 10k+ tokens with 4k
# decode ≈ 15k KV per request; 8×15k overflows the AWQ KV pool — DMR-072 +
# Granite KV evidence; 4×15k fits with shared-prefix caching), scaledown 120.
# Single extract call per doc (standard isolated path); Qwen needs no
# thinking-inflated decode (4096 budget as in all Qwen AWQ legs).
#
# SEQUENCED AFTER the Granite legs — do NOT deploy while another app is warm:
#   modal profile activate hermes-agent-jjb
#   eval "$(sandbox modal-matrix env Qwen/Qwen3-8B-AWQ)"
#   # export MODAL_VLLM_MAX_CONTAINERS=1 MODAL_VLLM_MIN_CONTAINERS=1 \
#   #   MODAL_VLLM_SCALEDOWN_SECONDS=120
#   modal run deploy/modal_vllm.py::download_model
#   modal deploy deploy/modal_vllm.py --strategy recreate
#   sandbox run benchmark-check --config config/runs/run-20-merger-specialist-awq.yaml
#   sandbox run preflight --config config/runs/run-20-merger-specialist-awq.yaml --live
#   sandbox run start --config config/runs/run-20-merger-specialist-awq.yaml --job-mode endpoint --watch
#   ./deploy/teardown_vllm.sh   # ONLY after this run (+ container list + billing window)
schema: sandbox.run/v1
run_id: run-20-merger-specialist-awq
task: contracts_specialist
profile: modal-vllm

prompt:
  # DMR-074 local pin (config/prompts/contracts_specialist_v33_simplified.txt) —
  # contracts agent prompt applied to merger docs (cross-agent baseline by design).
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: train — test has only ~17 merger_agreement rows (same as Granite leg)
  split: train
  revision: ed7576b676343e0b402ec5412cded301e629bdee   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      # merger_agreement: all 5 consideration types → 20 (same quotas as Granite leg)
      - doc_class: merger_agreement
        sub_buckets:
          - {subclass: all_cash, count: 7}                   # avail 51
          - {subclass: other, count: 7}                      # avail 49
          - {subclass: all_stock, count: 3}                  # avail 22
          - {subclass: mixed_cash_stock, count: 2}           # avail 12
          - {subclass: mixed_cash_stock_election, count: 1}  # avail 1
  limit: 20
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768      # AWQ L4 window (bf16 stays 16384)
    gpu_memory_utilization: 0.90
    max_num_seqs: 6              # L4 long-prompt: 4–6 (cliff at ~8 × ~8k)
    enable_prefix_caching: true
    enforce_eager: true
    quantization: awq
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120    # attended cost-saver (DMR-076)
    max_containers: 1         # 1×L4 cost guard — do not raise
    min_containers: 1         # pinned warm for this run (teardown after)
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 1              # HARD CAP per cost directive — fail fast, no credit burn
  fail_fast: false
  concurrency: 8              # HARD REQ: c=8 like all Qwen AWQ legs (no measured Qwen-merger pile-up; Granite c=3 evidence does not transfer — AWQ KV pool ~2x Granite FP8)
  cost_cap_usd: 0.70          # merger-length decode wall headroom over 20-doc siblings
  max_wall_seconds: 3600      # merger-length decode wall headroom

trace:
  sink: none
  otlp: false
  environment: specialist-20-merger-awq
  tags: [sandbox, job, specialist, merger, qwen3-8b-awq, l4, benchmark, c4]
