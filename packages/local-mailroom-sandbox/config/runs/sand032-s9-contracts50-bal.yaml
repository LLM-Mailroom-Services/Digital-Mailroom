# SAND-032 Stage 9 (balanced B): max_inputs 32 = max_num_seqs so Modal's router splits c64 32/32 (s7 sent 97/100 to one replica).
# SAND-032 Stage 3 — contracts n=50 on the warm fleet (serving metrics only: no extraction ground truth).
# Spec: docs/superpowers/specs/2026-09-27-qwen3-l4-serving-ladder-design.md
# Public HF mailroom-dataset only (no partner/proprietary data). Modal profile: exios66.
# Frozen serving block = Stage-1 winner (assumed L5 until Stage 1 runs; Task 11 Step 5
# rewrites this block if a rung is reverted — fp8 KV stays regardless).
#
#   modal profile activate exios66
#   set -a; eval "$(sandbox run deploy-env --config config/runs/sand032-s9-contracts50-bal.yaml)"; set +a
#   sandbox run benchmark-check --config config/runs/sand032-s9-contracts50-bal.yaml --modal-profile exios66
#   sandbox run preflight --config config/runs/sand032-s9-contracts50-bal.yaml --live
#   sandbox run start --config config/runs/sand032-s9-contracts50-bal.yaml --job-mode endpoint --watch
schema: sandbox.run/v1
run_id: sand032-s9-contracts50-bal
task: contracts_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all                  # test-only cannot back 100-row draws
  revision: ed7576b676343e0b402ec5412cded301e629bdee   # FAMILY_HF_REVISION (v9.1)
  strata:
    buckets:
      - {doc_class: contract, count: 50}   # single class bucket → nested 20 ⊂ 50 ⊂ 100
  limit: 50
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 32
    enable_prefix_caching: true
    enforce_eager: false
    quantization: "awq_marlin"
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32]
    max_inputs: 32
  modal:
    app: sandbox-vllm-sand032
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 2
    min_containers: 2
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 64
  cost_cap_usd: 1.4
  max_wall_seconds: 5400

trace:
  sink: none
  otlp: false
  environment: sand032
  tags: [sandbox, sand032, qwen3-8b, l4, contract]
