# Standalone React-desk server (optional; production bakes the SPA into the
# operator image instead). Serves the Vite build at /desk/ — its production
# base — and reverse-proxies the same-origin API to the backend.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /desk/;
    }

    # Files land at /usr/share/nginx/html/desk (see Dockerfile); fall back to
    # index.html so client-side routes (/desk/login, …) deep-link correctly.
    location /desk/ {
        try_files $uri $uri/ /desk/index.html;
    }

    # Same-origin API — the SPA calls /api, /v1 and /ws/pipeline. `mailroom`
    # is the backend service name on the operator compose network.
    location /api/ {
        proxy_pass http://mailroom:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://mailroom:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://mailroom:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}