# GitHub-flavored markdown lint. Rules relaxed for the existing docs corpus;
# vendored snapshots are byte-pinned and never linted.
config:
  default: true
  MD013: false   # line length
  MD004: false   # list style
  MD018: false
  MD019: false
  MD022: false
  MD024: false
  MD025: false
  MD028: false
  MD038: false
  MD037: false
  MD046: false
  MD001: false
  MD047: false
  MD055: false
  MD056: false
  MD026: false
  MD029: false
  MD030: false
  MD031: false
  MD032: false
  MD033: false   # inline HTML (GFM badges/details)
  MD034: false
  MD036: false
  MD040: false
  MD041: false
  MD060: false
globs:
  - "**/*.md"
ignores:
  - vendor/**
  - node_modules/**
  - data/**
  - reports/**
  - docs/prompts/**
  - CHANGELOG.md
  - docs/cli-reference.md   # generated
