events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    upstream mailroom {
        server mailroom:8001;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/ {
            proxy_pass http://mailroom;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /v1/ {
            proxy_pass http://mailroom;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /ws {
            proxy_pass http://mailroom;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /ws/pipeline {
            proxy_pass http://mailroom;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Catch-all proxies to mailroom, which serves the pixel console at /
        # and — in the operator image — the baked React desk at /desk/*
        # (operator_desk/mount.py serves ui/dist via MAILROOM_UI_DIST or the
        # baked /app/ui/dist). The SPA fallback lives in the mailroom
        # container, NOT here: `try_files` was removed because it performs
        # local-filesystem checks against this nginx's own (empty) root and
        # has no meaning inside a pure proxy_pass location.
        location / {
            proxy_pass http://mailroom;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
