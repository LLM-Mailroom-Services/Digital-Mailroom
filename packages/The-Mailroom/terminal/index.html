<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050709">
<meta name="robots" content="index,follow">
<meta name="description" content="THE MAILROOM — a terminal. Type ls, cat, cd, corpus, repos, floor to explore the llm-mailroom pipeline, the mailroom-dataset corpus, and the constellation of repos that make it run.">
<link rel="canonical" href="https://exios66.github.io/The-Mailroom/terminal/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THE MAILROOM">
<meta property="og:title" content="THE MAILROOM — mailroom@floor:~">
<meta property="og:description" content="The llm-mailroom pipeline as an interactive terminal. Type 'help' to begin.">
<meta property="og:url" content="https://exios66.github.io/The-Mailroom/terminal/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="THE MAILROOM — mailroom@floor:~">
<meta name="twitter:description" content="The llm-mailroom pipeline as an interactive terminal. Type 'help' to begin.">
<title>THE MAILROOM — mailroom@floor:~</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050709'/%3E%3Crect x='7' y='8' width='18' height='16' fill='%23a3e635'/%3E%3Crect x='9' y='10' width='14' height='2' fill='%23050709'/%3E%3Crect x='9' y='14' width='14' height='2' fill='%23050709'/%3E%3Crect x='9' y='18' width='9' height='2' fill='%23050709'/%3E%3C/svg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/terminal.css?v=0.4.0">
</head>
<body>
  <!-- CRT overlay -->
  <div class="crt-overlay" id="crtOverlay" aria-hidden="true">
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="flicker"></div>
  </div>

  <!-- Ambient mailroom skyline -->
  <div id="ambientSkyline" aria-hidden="true">
    <div class="fog f1"></div>
    <div class="fog f2"></div>
    <svg class="skyline back" id="skylineBack" preserveAspectRatio="none" viewBox="0 0 1440 120"></svg>
    <svg class="skyline front" id="skylineFront" preserveAspectRatio="none" viewBox="0 0 1440 120"></svg>
    <div id="ambientConveyor"></div>
  </div>

  <!-- Status bar -->
  <header class="status-bar" role="banner">
    <div class="status-group">
      <span class="status-item essential"><span class="dot" aria-hidden="true"></span>mailroom@floor</span>
      <span class="status-item essential">pwd: <b id="statusPath">~</b></span>
      <span class="status-item essential"><a class="sister-link" id="statusPixel" href="../" title="the pixel console — same runs, more chrome">pixel&nbsp;↗</a></span>
      <span class="status-item"><a class="sister-link" id="statusObs" href="../live/" title="the hosted Observatory">observatory&nbsp;↗</a></span>
      <span class="status-item"><a class="sister-link" id="statusHub" href="https://huggingface.co/datasets/Lucius-Morningstar/mailroom-dataset" target="_blank" rel="noopener noreferrer" title="the mailroom-dataset corpus on the Hub">hub&nbsp;↗</a></span>
    </div>
    <div class="status-group">
      <span class="status-item">theme: <b id="statusTheme">amber</b></span>
      <span class="status-item">crt: <b id="statusCrt">on</b></span>
      <span class="status-item">sound: <b id="statusSound">off</b></span>
      <span class="status-item">corpus: <b id="statusCorpus">…</b></span>
      <span class="status-item essential" id="statusTime">--:--:--</span>
    </div>
  </header>

  <!-- Terminal body -->
  <main class="terminal" role="main">
    <div class="output" id="output" aria-live="polite" aria-label="terminal output" tabindex="-1"></div>

    <div class="prompt-line" id="promptLine">
      <span class="prompt" id="promptText" aria-hidden="true">mailroom@floor<span class="path">:~</span>$</span>
      <div class="input-area">
        <div class="input-display" aria-hidden="true">
          <span id="typedText"></span><span class="block-cursor" id="blockCursor"></span><span class="ghost-text" id="ghostText"></span>
        </div>
        <input
          type="text"
          id="cmdInput"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="terminal command input"
          autofocus
        />
      </div>
    </div>
  </main>

  <noscript>
    <div style="position:fixed;inset:0;background:#050709;color:#d8d4ce;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;z-index:999;">
      <p>This page is an interactive terminal and needs JavaScript.<br>
      The pixel console lives at <a style="color:#67e8f9" href="../">https://exios66.github.io/The-Mailroom/</a></p>
    </div>
  </noscript>

<script src="js/data.js?v=0.4.0"></script>
<script src="js/terminal.js?v=0.4.0"></script>
</body>
</html>
