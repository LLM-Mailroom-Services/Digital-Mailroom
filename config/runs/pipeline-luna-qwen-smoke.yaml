# SUPERSEDED: chat model openai/gpt-6-luna as the decision reviewer; preflight now refuses
# a paid chat-model reviewer run without an explicit opt-in. allow_chat_model: true marks the chat
# comparison as deliberate. Kept as the record of
# reports/reviewer-calibration/reviewer-calibration-luna.md and pipeline-luna-qwen-smoke-3class.json; the current smoke is pipeline-luna-decisions-qwen-smoke.yaml.
#
# Full pipeline over OpenRouter: Qwen3.7 Flash on every node, with OpenAI Luna as
# the decision reviewer on all five primary classes (corporate_record included), on the
# sorter_reviewer_decision_v3 prompt and the cutoffs its full-corpus calibration picked
# (all 2,979 train documents; 98.8% routed unattended with one misroute on the 323-document
# test split; reports/reviewer-calibration/reviewer-calibration-luna.md). Every decision
# class is reviewed at any sorter confidence (#215).
# The sorter and intake read the whole document in ONE call (max_input_chars 600,000 covers
# the largest smoke document, a 504k-character merger; Qwen3.7 Flash has a 1M-token context).
# Only the extraction specialists chunk. Documents run 10 at a time.
# The earlier three-class run is kept in reports/reviewer-calibration/pipeline-luna-qwen-smoke-3class.json.
schema: sandbox.run/v1
run_id: pipeline-luna-qwen-smoke
task: pipeline
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    sorter_reviewer: {source: local, file: sorter_reviewer_decision_v3}

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: train
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - doc_class: contract
        count: 2
        sub_buckets:
          - {subclass: "License_Agreements", count: 1}
          - {subclass: "Maintenance", count: 1}
      - doc_class: merger_agreement
        count: 2
        sub_buckets:
          - {subclass: "all_cash", count: 1}
          - {subclass: "other", count: 1}
      - doc_class: corporate_record
        count: 2
        sub_buckets:
          - {subclass: "articles_of_incorporation", count: 1}
          - {subclass: "charter_amendment", count: 1}
      - doc_class: correspondence
        count: 2
        sub_buckets:
          - {subclass: "email", count: 1}
          - {subclass: "notice", count: 1}
      - doc_class: insurance_claim
        count: 2
        sub_buckets:
          - {subclass: "auto", count: 1}
          - {subclass: "property", count: 1}
  limit: 10
  sample_seed: 42
  require_task_gt: true   # every document can be scored

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

agent_routes:
  sorter_reviewer: {provider: openrouter, model: openai/gpt-6-luna}
  judge: {provider: openrouter, model: qwen/qwen3.7-flash}
  boss: {provider: openrouter, model: qwen/qwen3.7-flash}

agent_knobs:
  sorter: {max_input_chars: 600000}
  intake: {max_input_chars: 600000}

reviewer:
  backend: api
  model: openai/gpt-6-luna
  allow_chat_model: true
  classes:
    contract: 0.79
    merger_agreement: 0.90
    corporate_record: 0.88
    correspondence: 0.54
    insurance_claim: 0.78

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 10
  cost_cap_usd: 0.50
  max_wall_seconds: 4800
  api_cost_cap_usd: 0.50   # the ceiling prices every token at Luna; Qwen bills about a third

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, openrouter, decision-reviewer]
