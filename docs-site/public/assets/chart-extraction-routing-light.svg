<text x="24.0" y="34.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Where extraction confidence routes a document</text>
<text x="24.0" y="56.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Per-class thresholds from taxonomy.yaml. The axis starts at 0.80; a score below 0.80 also retries.</text>
<rect x="24" y="72" width="12" height="12" rx="3" fill="#86b6ef"/>
<text x="42.0" y="82.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Retry extraction (below low)</text>
