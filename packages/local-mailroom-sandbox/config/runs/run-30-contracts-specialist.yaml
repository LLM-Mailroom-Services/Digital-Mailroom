# Specialist extract: contracts_specialist on 30 CONTRACT docs (primary class).
# Subclass-stratified within contract (9 largest CUAD subtypes × proportional
# quotas summing to 30). Test split has 60 contracts — enough for N=30.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ CUT SPEND (DMR-076/077/078) — MANDATORY operator posture                 ║
# ║  1. ONE warm sandbox-vllm app through YOUR TRACK (or all five if solo).  ║
# ║  2. Do NOT tear down / redeploy / stop between classes.                  ║
# ║  3. Teardown ONLY after your last: ./deploy/teardown_vllm.sh             ║
# ║  4. scaledown_seconds: 120 (attended). Unattended/overnight → restore 600║
# ║  5. Default model: Qwen/Qwen3-8B bf16. AWQ is OPTIONAL (DMR-068 gate).   ║
# ║  6. Two-operator: sandbox run suite --suite track-a|track-b (DMR-077).   ║
# ║  7. DMR-078: per-doc-type concurrency / max_tokens / cost_cap / wall.    ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Doc-type posture (specialist_posture): concurrency=4, max_tokens=4096,
# max_input_chars fitted to L4 16k context, cost_cap_usd=0.80, max_wall=4800s.
#
# Morning CLI (warm once → five runs → teardown) — see docs/benchmark-l4.md:
#   modal profile activate hermes-agent-jjb
#   export SANDBOX_PROFILE=modal-vllm MODAL_VLLM_MODEL=Qwen/Qwen3-8B \
#     MODAL_VLLM_GPU=L4 MODAL_VLLM_IMAGE_TAG=v0.29.0 \
#     MODAL_VLLM_MAX_CONTAINERS=1 MODAL_VLLM_SCALEDOWN_SECONDS=120
#   modal run deploy/modal_vllm.py::download_model && modal deploy deploy/modal_vllm.py
#   sandbox cutover --profile modal-vllm && sandbox health --profile modal-vllm
#   for cfg in config/runs/run-30-{contracts,merger,corporate-records,correspondence,insurance-claims}-specialist.yaml; do
#     sandbox run preflight --config "$cfg" --live
#     sandbox run start --config "$cfg" --job-mode endpoint --watch
#   done
#   ./deploy/teardown_vllm.sh
schema: sandbox.run/v1
run_id: run-30-contracts-specialist
task: contracts_specialist
profile: modal-vllm

prompt:
  # Pinned local production text (config/prompts/contracts_specialist_v33.txt) for reproducible
  # Modal L4 Qwen runs — not Langfuse floating production. DMR-074/078.
  default: {source: code-default}
  agents:
    contracts_specialist:
      source: local
      file: contracts_specialist_v33

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  # split: test — 60 contract rows (pinned 46a4d3c2); N=30 fits without train
  split: test
  revision: 46a4d3c240a36671cde0182fff4960f6b8b73aca   # pinned (FAMILY_HF_REVISION)
  strata:
    buckets:
      # contract (60 test rows): 9 largest of 19 subclasses → 30 rows
      - doc_class: contract
        sub_buckets:
          - {subclass: service, count: 6}              # avail 8
          - {subclass: supply, count: 3}               # avail 5
          - {subclass: distributor, count: 3}          # avail 5
          - {subclass: co_branding, count: 3}          # avail 5
          - {subclass: ip, count: 3}                   # avail 4
          - {subclass: development, count: 3}          # avail 4
          - {subclass: maintenance, count: 3}          # avail 4
          - {subclass: strategic_alliance, count: 3}   # avail 4
          - {subclass: sponsorship, count: 3}          # avail 3
  limit: 30
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B
  vllm:
    max_model_len: 16384      # boot-valid cap for L4-bf16 8B (v0.29.0 raises above)
    gpu_memory_utilization: 0.90
    max_num_seqs: 256
    quantization: ""
    revision: ""
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    # Attended cost-saver (DMR-076). Unattended/overnight: restore 600 here
    # and export MODAL_VLLM_SCALEDOWN_SECONDS=600 before redeploy.
    scaledown_seconds: 120
    max_containers: 1         # cost guard — do not raise for specialist runs
    min_containers: 0         # scale-to-zero after idle
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 4              # DMR-078 per-doc-type (short↑ / long↓)
  cost_cap_usd: 0.8        # abort if wall×L4 $/hr exceeds
  max_wall_seconds: 4800    # hard wall abort

trace:
  sink: none
  otlp: false
  environment: specialist-30
  tags: [sandbox, job, specialist, contracts, qwen3-8b, l4, benchmark]
