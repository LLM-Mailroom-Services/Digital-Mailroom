# Extraction gate round 2, step 2 of 2 (question set 1.1.0, whole documents): openai/gpt-6-luna-decisions over the 690 NEW train documents
# of the five round-2 specialist runs (240 insurance_claim, 160 corporate_record, 240 correspondence,
# 40 contract over all 26 CUAD subtypes, 10 merger_agreement with a labelled consideration subclass).
# None of them was in the baseline (by id or folded text). State = {document, extraction_handoff}.
#
#   sandbox run start --config config/runs/extraction-gate-luna-v1.1.0-r2.yaml --initials XX
#   python scripts/extraction_gate.py calibrate --run extraction-gate-luna-v1.1.0-r2
#
# Cost: Decisions bills input only ($0.10 per 1M): about 2.4M input tokens, about $0.24; cap $0.60.
schema: sandbox.run/v1
run_id: extraction-gate-luna-v1.1.0-r2
task: extraction_gate
profile: openrouter

prompt:
  default: {source: code-default}

dataset:
  provider: file
  local_path: data/runtime/handoff/gate-train-r2.jsonl
  config: ground_truth
  split: train

engine:
  kind: openrouter
  model: openai/gpt-6-luna-decisions
  modal: null

reviewer:
  backend: decisions
  model: openai/gpt-6-luna-decisions
  questions: extraction_gate_v1.1.0
  handoff_run:
    - extraction-gate-specialist-insurance-claim-qwen-r2
    - extraction-gate-specialist-corporate-record-qwen-r2
    - extraction-gate-specialist-correspondence-qwen-r2
    - extraction-gate-specialist-contract-qwen-r2
    - extraction-gate-specialist-merger-agreement-qwen-r2

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 12
  cost_cap_usd: 1.00
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.60

trace:
  sink: none
  environment: pilot
  # The tag says 1.0.0 but this run used question set 1.1.0. It is kept as run: the trace block is
  # in the spec hash, so changing it would split this finished run from its lock, and its traces
  # were already sent with this tag. Filter 1.1.0 traces by run id. New runs tag their own version.
  tags: [sandbox, job, extraction-gate, decisions-api, extraction-gate-1.0.0]
