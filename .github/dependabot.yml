# Dependabot for the Digital-Mailroom monorepo (HUB-030).
#
# SCOPE NOTE — why packages/*/ manifests are deliberately absent:
# every package under packages/ is a git-subtree mirror of an independent
# Exios66 repo (see AGENTS.md "Sub-package sync", scripts/sync_packages.py).
# Dependabot PRs against those manifests would (a) create monorepo-ahead
# drift against the sync driver's cursors, and (b) bump release-time-only
# git pins (e.g. llm-dojo-scoring @ vX.Y.Z inside llm-mailroom) against the
# workspace-pins law. Dependency freshness for the family is therefore
# handled per-package in the standalone repos; this config covers the hub
# itself plus the actively maintained sandbox deploy surface.
#
# Auto-merge: patch/minor Dependabot PRs are squash-merged when CI is green
# via .github/workflows/dependabot-auto-merge.yml. Majors stay manual.

version: 2
updates:
  # Hub workspace: root pyproject.toml + uv.lock (pip ecosystem covers uv).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    groups:
      hub-dev-deps:
        applies-to: version-updates
        dependency-type: "development"
      hub-prod-deps:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Hub CI: action refs in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  # Offline sandbox image (HUB-015 pins doctrine): base-image bumps land as
  # monorepo-side changes. Other packages' Dockerfiles are excluded — same
  # mirror rationale as above.
  - package-ecosystem: "docker"
    directory: "/packages/local-mailroom-sandbox/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
