# Specialist-condensed lineage, validation: insurance_claims_specialist_condensed_v3 on the SAME insurance_claim documents the
# baseline run extraction-gate-specialist-insurance-claim-qwen extracted with the frozen prompt, so the two
# are compared document by document (scripts/compare_specialist_prompt.py). VALIDATION ONLY: these
# outputs repeat baseline documents and are never handed to the extraction gate.
#
#   sandbox run start --config config/runs/specialist-condensed-v3-insurance-claim-qwen-ab.yaml --initials XX
schema: sandbox.run/v1
run_id: specialist-condensed-v3-insurance-claim-qwen-ab
task: insurance_claims_specialist
profile: openrouter

prompt:
  default: {source: code-default}
  agents:
    insurance_claims_specialist: {source: local, file: insurance_claims_specialist_condensed_v3}

dataset:
  provider: file
  local_path: data/runtime/handoff/gate-train-insurance_claim.jsonl
  config: ground_truth
  split: train

engine:
  kind: openrouter
  model: qwen/qwen3.7-flash
  modal: null

job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 12
  cost_cap_usd: 1.00
  max_wall_seconds: 3600
  api_cost_cap_usd: 0.05

trace:
  sink: none
  environment: pilot
  tags: [sandbox, job, specialist-condensed-v3, ab-validation, insurance-claim]
