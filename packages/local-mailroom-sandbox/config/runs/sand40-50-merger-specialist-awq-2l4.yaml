# SAND-040 † merger cell — merger_agreement_specialist · n=50 · 2×L4 · C32 · optimized settings on 32K.
# Same 50 agreements as grid-50-merger-specialist-awq-2l4 (seed 42, rev ed7576b6); differences:
#   input   = chunked whole-document extraction (the pipeline's own pass): max_input_chars 54000,
#             47,000-char windows + 6,500-char overlap, deterministic merge — instead of a 30,000-char head+tail
#   decode  = max_tokens 6144, temperature 0.7, top_p 0.8, top_k 20, presence_penalty 1.0,
#             one re-sample on LengthFinishReasonError (start-time SANDBOX_AGENT_KNOBS)
#   prompt  = merger_agreement_specialist_maud_v1 (MAUD answer catalog)
#   engine  = the same 32K 2×L4 deploy as the other SAND-40 cells (no 64K, no redeploy)
# Runs after the 5-agreement gate (sand40-check-5-merger-specialist-awq-2l4) passes.
# Runbook: sandbox runbook show sand40
schema: sandbox.run/v1
run_id: sand40-50-merger-specialist-awq-2l4
task: merger_agreement_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    merger_agreement_specialist:
      source: local
      file: merger_agreement_specialist_maud_v1

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - {doc_class: merger_agreement, count: 50}   # single class bucket, seed 42 → the SAND-37 2×L4 agreements
  limit: 50
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: "awq_marlin"
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 32
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 2
    min_containers: 2
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 32
  cost_cap_usd: 2.5
  max_wall_seconds: 5400

trace:
  sink: none
  otlp: false
  environment: qwen-sand40
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, grid, sand40]
