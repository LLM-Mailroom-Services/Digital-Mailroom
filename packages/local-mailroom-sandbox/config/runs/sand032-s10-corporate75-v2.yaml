# SAND-032 Stage 10: eval-environment v2 prompt (corporate_records_specialist_v2_evalenv), n=75, 1×L4 c8, frozen engine. Paired vs sand032-s3-corporate50 on the nested first 50.
# SAND-032 Stage 3 — corporate_records n=50 on the warm 2-replica fleet.
# Spec: docs/superpowers/specs/2026-09-27-qwen3-l4-serving-ladder-design.md
# Public HF mailroom-dataset only (no partner/proprietary data). Modal profile: exios66.
# Frozen serving block = Stage-1 winner (assumed L5 until Stage 1 runs; Task 11 Step 5
# rewrites this block if a rung is reverted — fp8 KV stays regardless).
#
#   modal profile activate exios66
#   set -a; eval "$(sandbox run deploy-env --config config/runs/sand032-s10-corporate75-v2.yaml)"; set +a
#   sandbox run benchmark-check --config config/runs/sand032-s10-corporate75-v2.yaml --modal-profile exios66
#   sandbox run preflight --config config/runs/sand032-s10-corporate75-v2.yaml --live
#   sandbox run start --config config/runs/sand032-s10-corporate75-v2.yaml --job-mode endpoint --watch
schema: sandbox.run/v1
run_id: sand032-s10-corporate75-v2
task: corporate_records_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    corporate_records_specialist:
      source: local
      file: corporate_records_specialist_v2_evalenv

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: all                  # test-only cannot back 100-row draws
  revision: ed7576b676343e0b402ec5412cded301e629bdee   # FAMILY_HF_REVISION (v9.1)
  strata:
    buckets:
      - {doc_class: corporate_record, count: 75}   # single class bucket → nested 20 ⊂ 50 ⊂ 100
  limit: 75
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 16
    enable_prefix_caching: true
    enforce_eager: false
    quantization: "awq_marlin"
    revision: ""
    kv_cache_dtype: "fp8"
    enable_thinking: false
    cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    max_inputs: 16
  modal:
    app: sandbox-vllm-sand032
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 1
    min_containers: 1
    prewarm: true

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.2
  max_wall_seconds: 3600

trace:
  sink: none
  otlp: false
  environment: sand032
  tags: [sandbox, sand032, qwen3-8b, l4, corporate_record]
