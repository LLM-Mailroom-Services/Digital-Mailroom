name: Board card (DMR-0NN)
description: Open the GitHub-issue mirror of a cross-package card on the governance/TASKS.md Kanban board
title: "DMR-0NN: "
labels: ["kanban", "type/task"]
body:
  - type: markdown
    attributes:
      value: |
        ## Board card — the issue is the mirror, the board is the truth

        `governance/TASKS.md` is the single source of truth. This issue is the
        external mirror of ONE card (one card = one issue — never a shared
        issue, never a bare number). Before opening:

        - **Read the board first** — never duplicate or race a claimed card.
          Work that addresses an existing card updates THAT card.
        - **Claim before edit** — move the card on the board, set Owner +
          date, and label it before the code, never after.
        - **Mirror lane moves as issue comments** — claim → comment,
          blocked → blocker comment, done → close.

        Lane/domain/priority labels are applied from the board by
        `python scripts/board_state.py sync-issues` — fill the dropdowns so
        the tracker can map them.
  - type: input
    id: card_id
    attributes:
      label: Card ID
      description: "The DMR-0NN this issue mirrors. Must already exist on governance/TASKS.md and must not collide with any other card."
      placeholder: "DMR-014"
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Lane (board status)
      description: The card's lane on the board at the time this issue is opened
      options:
        - unassigned
        - assigned
        - in_progress
        - needs_attention
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Where the work lands — hub scope or the package it touches
      options:
        - hub (monorepo-level / cross-package)
        - governance (board, AGENTS.md, templates)
        - tooling (scripts/, CI workflows)
        - enron-evaluation-environment
        - the-mailroom
        - agent-mailroom
        - claims-data-eda
        - llm-dojo-scoring
        - llm-entity-extraction
        - llm-mailroom
        - llm-mailroom-graph
        - local-mailroom-sandbox
        - mailroom-corpus-eda
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: The card's scope — mirror the board's Task cell and extend with any detail the board shouldn't hold
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Packages touched
      description: Package directories under packages/ (and their standalone upstream repos, if synced)
      placeholder: |
        - packages/llm-mailroom (upstream Exios66/llm-mailroom)
        - governance/TASKS.md
  - type: textarea
    id: evidence_plan
    attributes:
      label: Evidence plan
      description: How `done` will be proven — the package suite(s) that must go green, artifacts, commit(s), and the issue-closed-in-same-commit rule for synced cards
      placeholder: |
        - [ ] suites: uv run pytest packages/llm-mailroom/src/tests
        - [ ] git status clean for the card's scope
        - [ ] Evidence names the commit(s)
  - type: checkboxes
    id: synced_laws
    attributes:
      label: Synced-card laws
      description: Required acknowledgments before opening (see the board's "Issues vs board" section)
      options:
        - label: "The card's Issue column on governance/TASKS.md carries the full link to this issue"
        - label: "Lane moves on the board will be mirrored here as comments"
        - label: "This issue will be closed in the SAME commit that archives the card"
        - label: "Commits reference the card: `DMR-0NN: <summary>`"
