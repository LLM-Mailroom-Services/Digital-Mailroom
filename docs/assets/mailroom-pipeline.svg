<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">LLM Mailroom canonical operational pipeline</title>
  <desc id="desc">Six-phase legal document pipeline showing classification and extraction retries, human governance, Judge and Arbiter completeness review, Boss conflict adjudication, deterministic compilation, catalog, and archive. Human corrections resume from the appropriate state.</desc>
  <defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55e39a"/></marker><marker id="yellow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd45a"/></marker><marker id="purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d39cff"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6262"/></marker></defs>
  <rect width="1600" height="1080" fill="#070b0d"/><rect x="28" y="24" width="1544" height="1032" rx="18" fill="#0a1013" stroke="#26353c"/>
  <g font-family="Arial,sans-serif">
    <text x="800" y="66" text-anchor="middle" font-size="34" font-weight="700" fill="#f4f8fb">LLM MAILROOM · CANONICAL PIPELINE</text>
    <text x="800" y="94" text-anchor="middle" font-size="16" fill="#91a5b1">13-node LangGraph state machine · six operator-visible phases · confidence, adjudication &amp; human governance</text>
    <rect x="90" y="135" width="520" height="96" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="183" r="22" fill="#55e39a"/><text x="124" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#07100b">1</text><text x="162" y="169" font-size="20" font-weight="700" fill="#55e39a">INGEST</text><text x="162" y="193" font-size="14" fill="#c6d2d9">Claim → normalize → manifest → text / vision inputs</text><text x="162" y="214" font-size="12" font-weight="600" fill="#7fae9b">Watcher / API · deterministic intake</text>
    <rect x="90" y="270" width="520" height="112" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="326" r="22" fill="#55e39a"/><text x="124" y="333" text-anchor="middle" font-size="18" font-weight="700" fill="#07100b">2</text><text x="162" y="307" font-size="20" font-weight="700" fill="#55e39a">CLASSIFY</text><text x="162" y="331" font-size="14" fill="#c6d2d9">SorterAgent → live pipeline class + confidence</text><text x="162" y="354" font-size="12" font-weight="600" fill="#7fae9b">High → Extract · Medium → Retry · Low / unknown → Review</text><text x="162" y="372" font-size="12" fill="#71858f">Live pipeline taxonomy: 5 document classes.</text>
    <rect x="90" y="421" width="520" height="122" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="482" r="22" fill="#55e39a"/><text x="124" y="489" text-anchor="middle" font-size="18" font-weight="700" fill="#07100b">3</text><text x="162" y="462" font-size="20" font-weight="700" fill="#55e39a">EXTRACT</text><text x="162" y="486" font-size="14" fill="#c6d2d9">Class specialist → structured Pydantic output</text><text x="162" y="509" font-size="12" font-weight="600" fill="#7fae9b">Schema + confidence + factuality + completeness gates</text><text x="162" y="528" font-size="12" fill="#71858f">Ambiguous completeness → Judge / Arbiter · conflicts → Boss</text>
    <rect x="90" y="583" width="520" height="78" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="622" r="22" fill="#55e39a"/><text x="124" y="629" text-anchor="middle" font-size="18" font-weight="700" fill="#07100b">4</text><text x="162" y="614" font-size="20" font-weight="700" fill="#55e39a">COMPILE</text><text x="162" y="638" font-size="14" fill="#c6d2d9">compile_report → deterministic matter-record assembly</text>
    <rect x="90" y="701" width="520" height="78" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="740" r="22" fill="#55e39a"/><text x="124" y="747" text-anchor="middle" font-size="18" font-weight="700" fill="#07100b">5</text><text x="162" y="732" font-size="20" font-weight="700" fill="#55e39a">CATALOG</text><text x="162" y="756" font-size="14" fill="#c6d2d9">catalog_write → document + matter persistence</text>
    <rect x="90" y="819" width="520" height="78" rx="14" fill="#0d171b" stroke="#55e39a" stroke-width="2"/><circle cx="124" cy="858" r="22" fill="#55e39a"/><text x="124" y="865" text-anchor="middle" font-size="18" font-weight="700" fill="#07100b">6</text><text x="162" y="850" font-size="20" font-weight="700" fill="#55e39a">ARCHIVE</text><text x="162" y="874" font-size="14" fill="#c6d2d9">archive → source + manifest + hash-chained audit</text>
    <path d="M350 231L350 270M350 382L350 421M350 543L350 583M350 661L350 701M350 779L350 819" stroke="#55e39a" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
    <rect x="760" y="135" width="700" height="132" rx="14" fill="#121015" stroke="#ffd45a" stroke-width="2"/><text x="790" y="168" font-size="20" font-weight="700" fill="#ffd45a">HUMAN REVIEW · GOVERNANCE BOUNDARY</text><text x="790" y="194" font-size="14" fill="#c6d2d9">Inspect evidence → disposition → rationale → resume from corrected state</text><text x="790" y="219" font-size="12" fill="#a9b6bd">Approve · correct classification · reconcile extraction · reject</text><text x="790" y="241" font-size="12" fill="#71858f">Durable parking: pipeline/review · manifest enables recovery if checkpoint is gone</text>
    <rect x="760" y="315" width="700" height="150" rx="14" fill="#130f18" stroke="#d39cff" stroke-width="2"/><text x="790" y="348" font-size="20" font-weight="700" fill="#d39cff">JUDGE → ARBITER · COMPLETENESS LANE</text><text x="790" y="374" font-size="14" fill="#c6d2d9">Judge checks completeness → Arbiter decides stand / re-extract / human review</text><text x="790" y="399" font-size="12" fill="#b9a8c6">Judge max passes: 3 · Arbiter retry max: 2 · field scoring is deterministic</text><text x="790" y="422" font-size="12" fill="#71858f">Re-extract returns to Extract; unresolvable cases return to Human Review.</text><text x="790" y="444" font-size="12" fill="#71858f">Configured ambiguous field-scoring bands determine entry to this lane.</text>
    <rect x="760" y="510" width="700" height="125" rx="14" fill="#180f0f" stroke="#ff6262" stroke-width="2"/><text x="790" y="543" font-size="20" font-weight="700" fill="#ff6262">BOSS ESCALATION · MATTER CONFLICT</text><text x="790" y="569" font-size="14" fill="#c6d2d9">Conflicting source values are adjudicated; they are never silently resolved by recency.</text><text x="790" y="594" font-size="12" fill="#bfa1a1">Approved → Compile · review required → Human Review</text><text x="790" y="616" font-size="12" fill="#71858f">Conflict and resolution remain in manifest, audit, and catalog records.</text>
    <rect x="760" y="680" width="700" height="152" rx="14" fill="#0d1418" stroke="#d7e2e8" stroke-width="1.5"/><text x="790" y="714" font-size="20" font-weight="700" fill="#d7e2e8">RESUME SEMANTICS</text><text x="790" y="740" font-size="13" fill="#c6d2d9">Human / Arbiter correction produces an explicit decision + rationale.</text><text x="790" y="763" font-size="13" fill="#c6d2d9">Classification correction → resume at Classify / specialist dispatch.</text><text x="790" y="786" font-size="13" fill="#c6d2d9">Extraction reconciliation → resume at Extract with corrected state.</text><text x="790" y="809" font-size="13" fill="#c6d2d9">Reject → terminal failed state; no silent bypass of governance.</text>
    <rect x="760" y="877" width="700" height="72" rx="12" fill="#0d1418" stroke="#26353c"/><text x="790" y="907" font-size="13" font-weight="700" fill="#91a5b1">SOURCE OF TRUTH</text><text x="790" y="929" font-size="12" fill="#71858f">Canonical diagram: Digital-Mailroom/docs/assets/mailroom-pipeline.svg</text><text x="790" y="945" font-size="12" fill="#71858f">Runtime detail: packages/llm-mailroom · taxonomy detail: docs/v7-taxonomy.md</text>
    <path d="M610 326C670 326 700 201 760 201" stroke="#ffd45a" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#yellow)"/><text x="635" y="283" font-size="12" fill="#ffd45a">low / unknown</text>
    <path d="M610 490C680 490 700 390 760 390" stroke="#d39cff" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#purple)"/><text x="630" y="451" font-size="12" fill="#d39cff">ambiguous completeness</text>
    <path d="M610 515C680 515 700 570 760 570" stroke="#ff6262" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#red)"/><text x="644" y="548" font-size="12" fill="#ff6262">matter conflict</text>
    <path d="M1110 465L1110 510M930 315C930 285 1040 267 1040 267M1110 635L1110 680" stroke="#d39cff" stroke-width="2.5" stroke-dasharray="8 7" fill="none"/>
    <path d="M760 201C680 201 650 326 610 326M760 230C690 230 650 482 610 482" stroke="#ffd45a" stroke-width="2.5" stroke-dasharray="8 7" fill="none"/><text x="665" y="222" font-size="12" fill="#ffd45a">classification correction</text><text x="665" y="330" font-size="12" fill="#ffd45a">extraction reconciliation</text>
    <path d="M760 420C690 420 650 505 610 505" stroke="#d39cff" stroke-width="2.5" stroke-dasharray="8 7" fill="none"/><text x="658" y="415" font-size="12" fill="#d39cff">re-extract</text><path d="M760 590C690 590 650 622 610 622" stroke="#ff6262" stroke-width="2.5" stroke-dasharray="8 7" fill="none"/><text x="664" y="604" font-size="12" fill="#ff6262">approved</text>
    <text x="90" y="960" font-size="12" fill="#71858f">Automated stages</text><line x1="170" y1="956" x2="220" y2="956" stroke="#55e39a" stroke-width="2.5" marker-end="url(#green)"/><text x="245" y="960" font-size="12" fill="#71858f">Human / adjudication</text><line x1="365" y1="956" x2="415" y2="956" stroke="#ffd45a" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#yellow)"/><text x="440" y="960" font-size="12" fill="#71858f">Escalation / feedback</text>
  </g>
</svg>
