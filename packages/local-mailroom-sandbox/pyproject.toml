[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-sandbox"
version = "0.3.0"
description = "Local-first experiment sandbox for the LLM-Mailroom pipeline (Ollama, vLLM, llama.cpp)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pydantic>=2.0",
    "openai>=1.30",
    # Vendored runtime surface (DMR-057/058): the TRACKED llm-dojo-scoring
    # snapshot imports numpy/pandas/matplotlib/openpyxl eagerly (error_analysis,
    # visualize, export) and the sandbox CLI imports llm_dojo_scoring at
    # startup — a clean `pip install .` must land them or `sandbox` dies on
    # ModuleNotFoundError. Keep in BASE deps, not [dev].
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    # SAND-019: the vendored dojo scorer soft-imports scipy's
    # ``linear_sum_assignment`` for OPTIMAL entity-list matching and silently
    # degrades to a greedy fallback when it is absent (``bipartite_matching_
    # failed``). Like numpy above it is a scoring-runtime dep, not an extra, so
    # a clean install scores entity lists optimally instead of greedily.
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    # reports/dashboard/pages_site.py renders the mailroom-issues Pages site (SAND-036).
    "markdown-it-py>=3.0",
    # `sandbox datasets pull` / `hf-pilot` / corpus work (DMR-058): the
    # offline-first BASE install skips these, so a clean venv gets a pointed
    # hint instead of a bare ModuleNotFoundError; [dev] installs them.
    "huggingface_hub>=0.24",
    "pyarrow>=15.0",
    # The default suite imports the vendored graph/agents/legalbench surface
    # (tests/test_vendor.py, test_legalbench.py, test_llm_timeout.py), which
    # needs langchain/langgraph/sqlalchemy. [dev] therefore pulls [pipeline]
    # so `pip install -e ".[dev]" && pytest` is green on a fresh venv.
    "mailroom-sandbox[pipeline]",
]
pipeline = [
    # Eager third-party surface of the vendored llm-mailroom tree's langchain
    # paths (legalbench suite, live mailroom agent calls) — DMR-058. The
    # OFFLINE-first base install deliberately omits these; suite/live runs
    # hint at this extra instead of crashing with a bare import error.
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    # Terminal review uses the API and durable interrupt checkpoints.
    "fastapi==0.162.0",
    "python-multipart==0.0.32",
    "langgraph-checkpoint-sqlite==3.1.2",
    "requests>=2.31",
    "watchdog>=4.0",
    # DMR-067/078: vendored graph live storage (storage.catalog / audit_log)
    # uses ``sqlite+aiosqlite://`` by default — sqlalchemy alone is not enough.
    # greenlet is required for SQLAlchemy asyncio on the platforms we run.
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    # PDF / page-image path used by specialist extract + intake (pypdf /
    # pdfplumber / pillow). Soft-imported in agents, but Modal + Docker
    # specialist runs must have them present.
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "pillow>=10.0",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
observability = [
    "langfuse>=4.0,<6",
    # Braintrust = opt-in hosted sink for eval spans. Verified against 0.42.0:
    # no start_root_span / Logger.score / Span.score in that line — see
    # src/mailroom_sandbox/eval/tracing.py for the adapter.
    "braintrust>=0.42,<0.49",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
hf = [
    "huggingface_hub>=0.24",
    "pyarrow>=15.0",
]
deploy = [
    # Pinned SDK for deploy/modal_vllm.py (verified 2026-09-09; the app file
    # records the same version). Bump deliberately after reading the release
    # notes — 1.5.5 removed `Secret.from_local`.
    "modal==1.6.2",
]
decision = [
    # Decision-model reviewer backend (src/mailroom_sandbox/decision_backends.py).
    # Exact pin: a tuned confidence cutoff is tied to one model version, and the
    # `typesafe:` model names and `provider_details["confidence"]` come from this
    # release's source. Imported lazily, so the offline install never needs it.
    "pydantic-ai-slim[typesafe]==2.63.0",
]
# DMR-057: the family eval stack (llm-mailroom + llm-dojo-scoring) is
# vendored under vendor/ and wired onto sys.path at import — the old
# `[pipeline]`/`[evals]` git-pin extras are gone; refresh the snapshots with
# `sandbox fetch-deps` instead. Current pins live in `_VENDOR_PINS`; each
# `vendor/*/VENDOR.md` records the exact provenance.
all = [
    "mailroom-sandbox[dev,deploy,hf,observability,notebooks,pipeline,decision]",
]

[project.scripts]
sandbox = "mailroom_sandbox.cli:main"
mailroom-sandbox = "mailroom_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mailroom_sandbox*"]

[tool.setuptools.package-data]
mailroom_sandbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "service_smoke: opt-in real Modal/HF CLI contract checks (SANDBOX_SERVICE_SMOKE=1)",
    "local_llm: live test against a local OpenAI-compatible server (skipped unless SANDBOX_LOCAL_LLM=1)",
]

# DMR-057: no workspace redirects needed — the family code is vendored and
# tracked in this package (vendor/llm-mailroom + vendor/llm-dojo-scoring).
# A plain `pip install .` (or `pip install -e ".[dev]"`) is fully self-contained.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor", "data", "notebooks"]

[tool.ruff.lint]
# Correctness-first gate: syntax errors, undefined names, mutable defaults,
# useless expressions, pylint errors. Widen (F401, B, UP, I) as debt is paid.
select = ["E9", "F401", "F63", "F7", "F82", "F841", "B006", "B018", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Compatibility adapters: the Dojo-owned names are re-exported on purpose.
"src/mailroom_sandbox/eval/cuad_scoring.py" = ["F401"]
"src/mailroom_sandbox/eval/maud_scoring.py" = ["F401"]

[tool.coverage.run]
source = ["src/mailroom_sandbox"]
branch = false

[tool.coverage.report]
# Measured 79% on CircleCI (2026-10-30); floor leaves ~2 points of headroom.
# Ratchet it up as coverage improves; never lower it to land a change.
fail_under = 77
show_missing = false
skip_empty = true
