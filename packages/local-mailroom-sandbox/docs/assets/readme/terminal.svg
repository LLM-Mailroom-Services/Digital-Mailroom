<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
  <title id="t">~/local-mailroom-sandbox — zsh</title>
  <desc id="d">Animated terminal: create and activate a virtualenv, install, copy the env file, bring up Langfuse, deploy the Modal vLLM endpoint with the serve runbook, check health, then run the pilot with the mock and against the deployed endpoint.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient></defs>
  <style>@media (prefers-reduced-motion: reduce){.motion{display:none}.typed{clip-path:none}}</style>
  <rect id="cyc" width="1" height="1" fill="none"><animate id="loop" attributeName="x" from="0" to="0" dur="23.3s" begin="0s;loop.end"/></rect>
  <rect x="1" y="1" width="898" height="510" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="44" rx="16" fill="#1c2230"/>
  <rect x="1" y="30" width="898" height="15" fill="#1c2230"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text x="450" y="28" text-anchor="middle" font-size="13" fill="#8b949e">~/local-mailroom-sandbox — zsh</text>
  <clipPath id="c0"><rect x="30" y="72" height="28" width="502.4"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="502.4" dur="2.08s" begin="loop.begin+0.6s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="92" font-size="15" clip-path="url(#c0)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">python3 -m venv .venv &amp;&amp; source .venv/bin/activate</tspan></text>
  <clipPath id="c1"><rect x="30" y="102" height="28" width="631.2"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="631.2" dur="0.35s" begin="loop.begin+3.6s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="122" font-size="15" clip-path="url(#c1)" fill="#8b949e" font-style="italic">  # puts `sandbox` on PATH; repeat the activate in every new shell</text>
  <clipPath id="c2"><rect x="30" y="132" height="28" width="254"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="254" dur="1.0s" begin="loop.begin+4.4s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="152" font-size="15" clip-path="url(#c2)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">pip install -e &quot;.[dev]&quot;</tspan></text>
  <clipPath id="c3"><rect x="30" y="162" height="28" width="290.8"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="290.8" dur="1.16s" begin="loop.begin+6.3s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="182" font-size="15" clip-path="url(#c3)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">cp config/.env.example .env</tspan></text>
  <clipPath id="c4"><rect x="30" y="192" height="28" width="134.4"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="134.4" dur="0.48s" begin="loop.begin+8.4s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="212" font-size="15" clip-path="url(#c4)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox up</tspan></text>
  <clipPath id="c5"><rect x="30" y="222" height="28" width="456.4"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="456.4" dur="0.35s" begin="loop.begin+9.8s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="242" font-size="15" clip-path="url(#c5)" fill="#8b949e" font-style="italic">  # langfuse only; the GPU endpoint is external</text>
  <clipPath id="c6"><rect x="30" y="252" height="28" width="281.6"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="281.6" dur="1.12s" begin="loop.begin+10.6s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="272" font-size="15" clip-path="url(#c6)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox runbook show serve</tspan></text>
  <clipPath id="c7"><rect x="30" y="282" height="28" width="373.6"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="373.6" dur="0.35s" begin="loop.begin+12.6s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="302" font-size="15" clip-path="url(#c7)" fill="#8b949e" font-style="italic">  # deploy → point → verify → teardown</text>
  <clipPath id="c8"><rect x="30" y="312" height="28" width="171.2"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="171.2" dur="0.64s" begin="loop.begin+13.5s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="332" font-size="15" clip-path="url(#c8)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox health</tspan></text>
  <clipPath id="c9"><rect x="30" y="342" height="28" width="226.4"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="226.4" dur="0.88s" begin="loop.begin+15s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="362" font-size="15" clip-path="url(#c9)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox pilot --mock</tspan></text>
  <clipPath id="c10"><rect x="30" y="372" height="28" width="263.2"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="263.2" dur="0.35s" begin="loop.begin+16.8s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="392" font-size="15" clip-path="url(#c10)" fill="#8b949e" font-style="italic">  # machinery only, no LLM</text>
  <clipPath id="c11"><rect x="30" y="402" height="28" width="235.6"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="235.6" dur="0.92s" begin="loop.begin+17.7s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="422" font-size="15" clip-path="url(#c11)"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">sandbox pilot --local</tspan></text>
  <clipPath id="c12"><rect x="30" y="432" height="28" width="447.2"><set attributeName="width" to="0" begin="loop.begin"/><animate attributeName="width" from="0" to="447.2" dur="0.35s" begin="loop.begin+19.5s" fill="freeze"/></rect></clipPath>
  <text class="typed" x="32" y="452" font-size="15" clip-path="url(#c12)" fill="#8b949e" font-style="italic">  # the same pipeline on the deployed endpoint</text>
