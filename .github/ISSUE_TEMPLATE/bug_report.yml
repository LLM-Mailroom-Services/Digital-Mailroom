name: Bug report
description: Something is broken in the monorepo — workspace wiring, sync driver, packaging, docs, or governance tooling
title: "[Bug]: "
labels: ["type/bug"]
assignees: Exios66
body:
  - type: markdown
    attributes:
      value: |
        ## Before filing

        - **Read the board first** (`governance/TASKS.md`) — if an open card
          already covers this problem, update THAT card instead (update,
          don't duplicate). Only file a new issue when no card covers it.
        - Bugs scoped to a single package belong in that package's own repo.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - sub-package sync (scripts/sync_packages.py, packages_sync.json)
        - board governance (governance/, scripts/board_state.py)
        - label/tooling (scripts/github_labels.py, .github/)
        - workspace wiring (pyproject.toml, uv.lock, uv sync)
        - packaging / imports (pip install, package layout)
        - docs (README / AGENTS / package docs drift)
        - CI (workflows)
        - other
    validations:
      required: true
  - type: dropdown
    id: packages
    attributes:
      label: Affected package(s)
      description: Leave as "none (hub-level)" for monorepo-scope bugs
      multiple: true
      options:
        - none (hub-level)
        - Enron-Evaluation-Environment
        - The-Mailroom
        - agent-mailroom
        - claims-data-eda
        - llm-dojo-scoring
        - llm-entity-extraction
        - llm-mailroom
        - llm-mailroom-graph
        - local-mailroom-sandbox
        - mailroom-corpus-eda
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Actual behavior, including the exact command and its output/error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened (cite the AGENTS.md rule / README section / board law if one defines it)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps from a clean checkout (uv sync → command → failure)
      placeholder: |
        1. uv sync
        2. python scripts/...
        3. error
    validations:
      required: true
  - type: textarea
    id: suite_evidence
    attributes:
      label: Suite evidence
      description: Which per-package test suite(s) you ran and their result — the failing suite is the bug's proving ground
      placeholder: "uv run pytest packages/llm-mailroom/src/tests → 770 passed, 2 failed"
  - type: input
    id: related
    attributes:
      label: Related card
      description: "Existing/new DMR-0NN card this bug belongs to (open one via the 'Board card' template if this is card-worthy)"
      placeholder: "DMR-012"
