# Full mailroom pipeline, hybrid: the sorter and specialists run on the Modal
# vLLM endpoint, the judge and boss over the OpenRouter API.
#
# Needs both the Modal endpoint (`sandbox runbook show serve`) and
# OPENROUTER_API_KEY. Any agent can be moved without editing this file:
#   sandbox run preflight --config config/runs/examples/pipeline-hybrid.yaml \
#     --agent-route sorter=openrouter:qwen/qwen3.5-9b   # validates the routes too
#   sandbox run start --config config/runs/examples/pipeline-hybrid.yaml \
#     --agent-route sorter=openrouter:qwen/qwen3.5-9b
# Alternatively, use the same Qwen3.7 Flash override at both steps:
#   sandbox run preflight --config config/runs/examples/pipeline-hybrid.yaml \
#     --agent-route sorter=openrouter:qwen/qwen3.7-flash
#   sandbox run start --config config/runs/examples/pipeline-hybrid.yaml \
#     --agent-route sorter=openrouter:qwen/qwen3.7-flash
# `sandbox doctor --live --service openrouter` validates the API key first.
schema: sandbox.run/v1
run_id: pipeline-hybrid-smoke
task: pipeline
profile: modal-vllm

# Prompts. Every agent uses its production default unless a role is pinned here.
#   Version texts: the dojo lineage (vendor/llm-dojo-scoring/src/llm_dojo_scoring/prompts/).
#   Local variants: config/prompts/*.txt (`prompt.agents.<role>: {source: local, file: <stem>}`).
#   sandbox prompts list-versions [--role contracts_specialist]   # archived / frozen / mutation
#   sandbox prompts show contracts_specialist_v3                  # one version's text
# The specialists and the sorter have several versions (e.g. correspondence_specialist_v0..v7).
# The intake, sorter_reviewer, judge, arbiter and boss nodes have only v1.
# Pin any role below (or pass `--prompt-version KEY` on the command line, which wins per role);
# preflight rejects an unknown key or a role this task does not run.
prompt:
  default: {source: code-default}
  # versions:
  #   contracts_specialist: contracts_specialist_v3
  #   correspondence_specialist: correspondence_specialist_v7
  #   sorter: sorter_v4

dataset:
  provider: file
  local_path: data/fixtures/hf/docclass_mini.jsonl
  limit: 5
  sample_seed: 1

engine:
  kind: modal-vllm
  model: Qwen/Qwen3.5-9B
  vllm:
    max_model_len: 16384
    max_inputs: 4              # match job.concurrency (preflight refuses 0)
    gpu_memory_utilization: 0.90
    max_num_seqs: 6
    enable_prefix_caching: true
    enforce_eager: true

agent_routes:
  judge: {provider: openrouter, model: deepseek/deepseek-v4-flash}
  boss: {provider: openrouter, model: deepseek/deepseek-v4-flash}

job:
  mode: endpoint
  mock: false
  max_retries: 2
  fail_fast: false
  concurrency: 4
  cost_cap_usd: 1.00          # paid runs refuse to start without a finite cap
  max_wall_seconds: 1800
  api_cost_cap_usd: 0.25      # OpenRouter token spend; recommended $0.05 for 5 docs (budget_advice), raised for headroom

trace:
  sink: none
  environment: pilot
  tags: [sandbox, pipeline, hybrid]
