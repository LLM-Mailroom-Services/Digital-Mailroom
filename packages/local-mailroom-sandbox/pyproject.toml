[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailroom-sandbox"
version = "0.1.0"
description = "Local-first experiment sandbox for the LLM-Mailroom pipeline (Ollama, vLLM, llama.cpp)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pydantic>=2.0",
    "openai>=1.30",
    # Self-contained (DMR-057): the pipeline (llm-mailroom@v0.6.0) and the
    # scoring engine (llm-dojo-scoring@v0.12.2) ship as TRACKED snapshots
    # under vendor/ — no git pip pins, no network needed to score/run.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
observability = [
    "langfuse>=4.0,<5",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
hf = [
    "huggingface_hub>=0.24",
    "pyarrow>=15.0",
]
deploy = [
    # Pinned SDK for deploy/modal_vllm.py (verified 2026-09-09; the app file
    # records the same version). Bump deliberately after reading the release
    # notes — 1.5.5 removed `Secret.from_local`.
    "modal==1.5.5",
]
# DMR-057: the family eval stack (llm-mailroom@v0.6.0 + llm-dojo-scoring@v0.12.2)
# is vendored under vendor/ and wired onto sys.path at import — the old
# `[pipeline]`/`[evals]` git-pin extras are gone; refresh the snapshots with
# `sandbox fetch-deps` instead.
all = [
    "mailroom-sandbox[dev,deploy,hf,observability,notebooks]",
]

[project.scripts]
sandbox = "mailroom_sandbox.cli:main"
mailroom-sandbox = "mailroom_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mailroom_sandbox*"]

[tool.setuptools.package-data]
mailroom_sandbox = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "local_llm: live test against a local OpenAI-compatible server (skipped unless SANDBOX_LOCAL_LLM=1)",
]

# DMR-057: no workspace redirects needed — the family code is vendored and
# tracked in this package (vendor/llm-mailroom + vendor/llm-dojo-scoring).
# A plain `pip install .` (or `pip install -e ".[dev]"`) is fully self-contained.
