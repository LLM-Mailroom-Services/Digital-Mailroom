# Clean 20-doc rerun of the 1×L4 merger cell (do not clobber the 19/1 report).
# Decode 16384 via start-time SANDBOX_AGENT_KNOBS (4096 and 8192 LengthFinish).
# Thinking off; MODAL_VLLM_MAX_INPUTS=8 (never 0 — that serializes HTTP).
# Keep GPU warm (min_containers=1); teardown after this job if nothing queued.
schema: sandbox.run/v1
run_id: grid-20-merger-specialist-awq-1l4-retry
task: merger_agreement_specialist
profile: modal-vllm

prompt:
  default: {source: code-default}
  agents:
    merger_agreement_specialist:
      source: local
      file: merger_agreement_specialist_simplified

dataset:
  provider: huggingface
  repo: Lucius-Morningstar/mailroom-dataset
  config: ground_truth
  split: train
  revision: ed7576b676343e0b402ec5412cded301e629bdee
  strata:
    buckets:
      - doc_class: merger_agreement
        sub_buckets:
          - {subclass: all_cash, count: 7}
          - {subclass: other, count: 7}
          - {subclass: all_stock, count: 3}
          - {subclass: mixed_cash_stock, count: 2}
          - {subclass: mixed_cash_stock_election, count: 1}
  limit: 20
  sample_seed: 42

engine:
  kind: modal-vllm
  model: Qwen/Qwen3-8B-AWQ
  vllm:
    max_model_len: 32768
    gpu_memory_utilization: 0.90
    max_num_seqs: 8
    enable_prefix_caching: true
    enforce_eager: true
    quantization: awq
    revision: ""
    enable_thinking: false
    max_inputs: 8
  modal:
    app: sandbox-vllm
    gpu: L4
    image_tag: v0.29.0
    scaledown_seconds: 120
    max_containers: 1
    min_containers: 1
    prewarm: true
job:
  mode: endpoint
  mock: false
  max_retries: 1
  fail_fast: false
  concurrency: 8
  cost_cap_usd: 0.7
  max_wall_seconds: 3600

trace:
  sink: none
  otlp: false
  environment: qwen-grid
  tags: [sandbox, job, specialist, qwen3-8b-awq, l4, grid, retry]
