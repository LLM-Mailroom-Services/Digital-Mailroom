<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="t d"
     font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="t">Digital Mailroom by the numbers</title>
  <desc id="d">5 core packages; 13 pipeline nodes; 5 document classes; 3,302 corpus rows (v9); 15 specialist agents; 1 lockfile to rule them.</desc>
  <rect width="1200" height="170" rx="22" fill="#0b1220"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.00s" repeatCount="indefinite"/>
    <rect x="28" y="20" width="177" height="130" rx="16" fill="#111a2e" stroke="#1f2a44"/>
    <text x="117" y="86" text-anchor="middle" font-size="46" font-weight="800" fill="#38bdf8">5</text>
    <text x="117" y="116" text-anchor="middle" font-size="14" fill="#94a3b8">core packages</text>
    <rect x="95" y="130" width="44" height="4" rx="2" fill="#38bdf8">
      <animate attributeName="width" values="44;84;44" dur="3s" begin="0.00s" repeatCount="indefinite"/>
      <animate attributeName="x" values="95;75;95" dur="3s" begin="0.00s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.15s" repeatCount="indefinite"/>
    <rect x="221" y="20" width="177" height="130" rx="16" fill="#111a2e" stroke="#1f2a44"/>
    <text x="310" y="86" text-anchor="middle" font-size="46" font-weight="800" fill="#22c55e">13</text>
    <text x="310" y="116" text-anchor="middle" font-size="14" fill="#94a3b8">pipeline nodes</text>
    <rect x="288" y="130" width="44" height="4" rx="2" fill="#22c55e">
      <animate attributeName="width" values="44;84;44" dur="3s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="x" values="288;268;288" dur="3s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.30s" repeatCount="indefinite"/>
    <rect x="415" y="20" width="177" height="130" rx="16" fill="#111a2e" stroke="#1f2a44"/>
    <text x="503" y="86" text-anchor="middle" font-size="46" font-weight="800" fill="#a3e635">5</text>
    <text x="503" y="116" text-anchor="middle" font-size="14" fill="#94a3b8">document classes</text>
    <rect x="481" y="130" width="44" height="4" rx="2" fill="#a3e635">
      <animate attributeName="width" values="44;84;44" dur="3s" begin="0.30s" repeatCount="indefinite"/>
      <animate attributeName="x" values="481;461;481" dur="3s" begin="0.30s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.45s" repeatCount="indefinite"/>
    <rect x="608" y="20" width="177" height="130" rx="16" fill="#111a2e" stroke="#1f2a44"/>
    <text x="697" y="86" text-anchor="middle" font-size="46" font-weight="800" fill="#facc15">3,302</text>
    <text x="697" y="116" text-anchor="middle" font-size="14" fill="#94a3b8">corpus rows (v9)</text>
    <rect x="675" y="130" width="44" height="4" rx="2" fill="#facc15">
      <animate attributeName="width" values="44;84;44" dur="3s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="x" values="675;655;675" dur="3s" begin="0.45s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.60s" repeatCount="indefinite"/>
    <rect x="801" y="20" width="177" height="130" rx="16" fill="#111a2e" stroke="#1f2a44"/>
    <text x="890" y="86" text-anchor="middle" font-size="46" font-weight="800" fill="#c084fc">15</text>
    <text x="890" y="116" text-anchor="middle" font-size="14" fill="#94a3b8">specialist agents</text>
    <rect x="868" y="130" width="44" height="4" rx="2" fill="#c084fc">
      <animate attributeName="width" values="44;84;44" dur="3s" begin="0.60s" repeatCount="indefinite"/>
      <animate attributeName="x" values="868;848;868" dur="3s" begin="0.60s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    <rect x="995" y="20" width="177" height="130" rx="16" fill="#111a2e" stroke="#1f2a44"/>
    <text x="1083" y="86" text-anchor="middle" font-size="46" font-weight="800" fill="#f472b6">1</text>
    <text x="1083" y="116" text-anchor="middle" font-size="14" fill="#94a3b8">lockfile to rule them</text>
    <rect x="1061" y="130" width="44" height="4" rx="2" fill="#f472b6">
      <animate attributeName="width" values="44;84;44" dur="3s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="x" values="1061;1041;1061" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
