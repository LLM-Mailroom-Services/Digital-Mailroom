events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    upstream mailroom {
        server mailroom:8001;
    }

    # Single production front door. Every location is a plain reverse proxy:
    # the FastAPI app owns the pixel console (/), the Observatory (/live), the
    # operator API (/v1 /api /ws /ws/pipeline) and the React desk (/desk, whose
    # SPA fallback lives in operator_desk/mount.py::optional_react_desk).
    #
    # Do NOT add try_files here: with no `root` it would resolve against THIS
    # container's filesystem (nginx:alpine has no app assets), never the
    # upstream — the original 404/500 hazard. `proxy_pass` without a URI path
    # forwards the full request URI untouched.
    server {
        listen 80;
        server_name localhost;

        location /api/ {
            proxy_pass http://mailroom;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /v1/ {
            proxy_pass http://mailroom;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /ws {
            proxy_pass http://mailroom;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /ws/pipeline {
            proxy_pass http://mailroom;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # /desk and /desk/... — index.html + hashed assets + client-side routes
        # are all served by the backend (ui/dist is baked into the operator
        # image). A plain proxy is enough; the backend owns the SPA fallback.
        location /desk {
            proxy_pass http://mailroom;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://mailroom;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}