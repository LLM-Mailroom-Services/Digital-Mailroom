  <title id="t">The-Mailroom</title>
  <desc id="d">Animated banner: a retro CRT showing the pixel-art mailroom floor. Envelopes ride a conveyor past the SORTER, EXTRACT, JUDGE, BOSS, REPORT and ARCHIVE stations; a flagged one is parked on the REVIEW siding. The source lamp reads LANGFUSE.</desc>
