  vllm: Qwen/Qwen3-8B
  llamacpp: qwen3-8b
  lmstudio: qwen3-8b
  openrouter: qwen/qwen3.7-flash
  fallback_ollama: qwen3:7b

map:
  qwen/qwen3.7-flash:
    ollama: qwen3:8b
    vllm: Qwen/Qwen3-8B
    llamacpp: qwen3-8b
    lmstudio: qwen3-8b
    openrouter: qwen/qwen3.7-flash
  qwen/qwen-3-7b:
    ollama: qwen3:7b
    vllm: Qwen/Qwen3-8B
    llamacpp: qwen3-7b
    lmstudio: qwen3-7b
