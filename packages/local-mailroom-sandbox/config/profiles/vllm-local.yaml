# yaml-language-server: $schema=./profile.schema.json
name: vllm-local
description: Local vLLM OpenAI-compatible server (GPU).
provider: vllm
default_model: Qwen/Qwen3-8B
judge_model: Qwen/Qwen3-8B
base_url: http://localhost:8000/v1
